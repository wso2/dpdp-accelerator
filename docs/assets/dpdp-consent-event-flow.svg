<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
  <title id="title">DPDP consent and event-publication flow, sequence view</title>
  <desc id="desc">A connected application creates a consent in Identity Server, which the Data Principal reviews and authorizes through the Consent Portal. Identity Server emits a lifecycle signal, and the connected application can also submit custom events directly, both entering the Event Notification service. Event Notification persists and queues the event, pushes it to the Data Processor by webhook, or waits for the Data Processor to poll for it, and later receives completion evidence back from that Data Processor.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B76"/>
    </marker>
    <style>
      .actor-label { font: 600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #16222B; text-anchor: middle; }
      .actor-sub   { font: 400 12.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8A97A0; text-anchor: middle; }
      .step-label  { font: 500 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #3A4750; }
      .step-num    { font: 700 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; }
      .icon        { fill: none; stroke: #FF7300; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .lifeline    { stroke: #DCE1E4; stroke-width: 2; stroke-dasharray: 4 5; }
      .arrow       { fill: none; stroke: #5B6B76; stroke-width: 2; marker-end: url(#arrow); }
    </style>

    <!-- Icon symbols, drawn centered on 0,0 -->
    <g id="icon-person">
      <circle class="icon" cx="0" cy="-10" r="11"/>
      <path class="icon" d="M -18 20 C -18 2, 18 2, 18 20"/>
    </g>
    <g id="icon-app">
      <rect class="icon" x="-22" y="-20" width="44" height="38" rx="5"/>
      <line class="icon" x1="-22" y1="-8" x2="22" y2="-8"/>
      <circle cx="-15" cy="-14" r="1.8" fill="#FF7300"/>
      <circle cx="-9" cy="-14" r="1.8" fill="#FF7300"/>
    </g>
    <g id="icon-shield">
      <path class="icon" d="M 0 -22 L 18 -13 L 18 4 C 18 18, 8 26, 0 30 C -8 26, -18 18, -18 4 L -18 -13 Z"/>
    </g>
    <g id="icon-broadcast">
      <circle cx="-10" cy="6" r="3.4" fill="#FF7300"/>
      <path class="icon" d="M 0 -6 A 15 15 0 0 1 0 18"/>
      <path class="icon" d="M 8 -16 A 27 27 0 0 1 8 28"/>
    </g>
    <g id="icon-org">
      <rect class="icon" x="-16" y="-24" width="32" height="46" rx="2"/>
      <line class="icon" x1="-9" y1="-14" x2="-9" y2="-8"/>
      <line class="icon" x1="0" y1="-14" x2="0" y2="-8"/>
      <line class="icon" x1="9" y1="-14" x2="9" y2="-8"/>
      <line class="icon" x1="-9" y1="0" x2="-9" y2="6"/>
      <line class="icon" x1="9" y1="0" x2="9" y2="6"/>
      <rect class="icon" x="-5" y="9" width="10" height="13"/>
    </g>
  </defs>

  <rect width="1200" height="830" fill="#FAFAF8"/>
  <text x="40" y="40" style="font: 700 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill:#16222B; text-anchor:start;">DPDP consent and event flow</text>
  <text x="40" y="64" style="font: 400 12.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill:#8A97A0; text-anchor:start;">Alternative producer and delivery paths are shown together</text>

  <!-- Actor headers -->
  <g transform="translate(100,120)"><use href="#icon-person"/></g>
  <text x="100" y="170" class="actor-label">Data Principal</text>
  <text x="100" y="188" class="actor-sub">Reviews and authorizes</text>

  <g transform="translate(350,120)"><use href="#icon-app"/></g>
  <text x="350" y="170" class="actor-label">Connected Application</text>
  <text x="350" y="188" class="actor-sub">Creates consent, publishes events</text>

  <g transform="translate(600,120)"><use href="#icon-shield"/></g>
  <text x="600" y="170" class="actor-label">Identity Server</text>
  <text x="600" y="188" class="actor-sub">Consent + Consent Portal</text>

  <g transform="translate(850,120)"><use href="#icon-broadcast"/></g>
  <text x="850" y="170" class="actor-label">Event Notification</text>
  <text x="850" y="188" class="actor-sub">Routes lifecycle and custom events</text>

  <g transform="translate(1100,120)"><use href="#icon-org"/></g>
  <text x="1100" y="170" class="actor-label">Data Processor</text>
  <text x="1100" y="188" class="actor-sub">Receives the event</text>

  <!-- Lifelines -->
  <line class="lifeline" x1="100" y1="205" x2="100" y2="700"/>
  <line class="lifeline" x1="350" y1="205" x2="350" y2="700"/>
  <line class="lifeline" x1="600" y1="205" x2="600" y2="700"/>
  <line class="lifeline" x1="850" y1="205" x2="850" y2="700"/>
  <line class="lifeline" x1="1100" y1="205" x2="1100" y2="700"/>

  <!-- Step 1: Connected Application -> Identity Server -->
  <path class="arrow" d="M 350 250 H 600"/>
  <circle cx="350" cy="250" r="11" fill="#16222B"/>
  <text x="350" y="254" class="step-num">1</text>
  <text x="475" y="240" class="step-label" text-anchor="middle">Create consent</text>

  <!-- Step 2: Data Principal -> Identity Server -->
  <path class="arrow" d="M 100 310 H 600"/>
  <circle cx="100" cy="310" r="11" fill="#16222B"/>
  <text x="100" y="314" class="step-num">2</text>
  <text x="350" y="300" class="step-label" text-anchor="middle">Review and authorize, via Consent Portal</text>

  <!-- Step 3: Identity Server -> Event Notification -->
  <path class="arrow" d="M 600 370 H 850"/>
  <circle cx="600" cy="370" r="11" fill="#16222B"/>
  <text x="600" y="374" class="step-num">3</text>
  <text x="725" y="360" class="step-label" text-anchor="middle">Lifecycle signal</text>

  <!-- Step 4: Connected Application -> Event Notification -->
  <path class="arrow" d="M 350 430 H 850"/>
  <circle cx="350" cy="430" r="11" fill="#16222B"/>
  <text x="350" y="434" class="step-num">4</text>
  <text x="600" y="420" class="step-label" text-anchor="middle">POST /events, for custom topics</text>

  <!-- Step 5: Event Notification self-loop, persist and queue -->
  <path class="arrow" d="M 850 490 C 900 490, 900 512, 852 512"/>
  <circle cx="850" cy="490" r="11" fill="#16222B"/>
  <text x="850" y="494" class="step-num">5</text>
  <text x="910" y="504" class="step-label" text-anchor="start">Persist and queue</text>

  <!-- Step 6: Event Notification -> Data Processor, webhook push -->
  <path class="arrow" d="M 850 560 H 1100"/>
  <circle cx="850" cy="560" r="11" fill="#16222B"/>
  <text x="850" y="564" class="step-num">6</text>
  <text x="975" y="550" class="step-label" text-anchor="middle">Deliver via webhook</text>

  <!-- Step 7: Data Processor -> Event Notification, poll pull -->
  <path class="arrow" d="M 1100 620 H 850"/>
  <circle cx="1100" cy="620" r="11" fill="#16222B"/>
  <text x="1100" y="624" class="step-num">7</text>
  <text x="975" y="610" class="step-label" text-anchor="middle">Poll for events</text>

  <!-- Step 8: Data Processor -> Event Notification, completion evidence -->
  <path class="arrow" d="M 1100 680 H 850"/>
  <circle cx="1100" cy="680" r="11" fill="#16222B"/>
  <text x="1100" y="684" class="step-num">8</text>
  <text x="975" y="670" class="step-label" text-anchor="middle">Completion evidence</text>

  <!-- Footer note -->
  <rect x="40" y="720" width="1120" height="80" rx="14" fill="#16222B"/>
  <text x="70" y="752" fill="#C7D5DC" style="font: 400 14px 'Segoe UI', Helvetica, Arial, sans-serif;">Steps 3 and 4 are alternative event producers; steps 6 and 7 are alternative delivery modes.</text>
  <text x="70" y="776" fill="#C7D5DC" style="font: 400 14px 'Segoe UI', Helvetica, Arial, sans-serif;">Webhook delivery is pushed by Event Notification; polling is pulled by the Data Processor instead.</text>
</svg>
