<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="1000" viewBox="0 0 1950 1000" role="img" aria-labelledby="title description">
  <title id="title">WSO2 DPDP Accelerator solution overview</title>
  <desc id="description">The Data Principal uses the Consent Portal while Data Fiduciary administrators, Data Protection Officers, and owned applications use the administration, grievance, consent, and rights capabilities of the WSO2 DPDP Accelerator. The accelerator provides portals, APIs, consent lifecycle, rights and grievance handling, notifications, a Data Processor registry, children and guardian consent, Identity Server capabilities, audit evidence, and encrypted data storage. Consent and erasure events are delivered through secured callbacks to contracted Data Processors and third-party systems.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16222B" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B76"/></marker>
    <style>
      .title { font: 700 28px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #16222B; }
      .brand { font: 700 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .section { font: 700 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8A97A0; letter-spacing: 1.6px; }
      .side-title { font: 700 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8A97A0; letter-spacing: 1.4px; text-anchor: middle; }
      .card-title { font: 600 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #16222B; }
      .side-entity-title { font: 600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #16222B; }
      .card-body { font: 400 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5B6B76; }
      .side-card { fill: #FFFFFF; stroke: #C7D5DC; stroke-width: 1.5; }
      .feature { fill: #FFFFFF; stroke: #DCE1E4; stroke-width: 1.5; }
      .portal { fill: #FFF3E8; stroke: #FF7300; stroke-width: 2; }
      .group { fill: #F4F6F7; stroke: #DCE1E4; stroke-width: 1.5; }
      .icon-box { fill: #F0F3F5; }
      .icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .connector { fill: none; stroke: #5B6B76; stroke-width: 2; marker-end: url(#arrow); }
      .callback { fill: none; stroke: #8A97A0; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .flow-label { font: 500 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5B6B76; text-anchor: middle; }
      .pill { fill: #F0F3F5; stroke: #C7D5DC; stroke-width: 1; }
      .pill-text { font: 500 11.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #3A4750; text-anchor: middle; }
    </style>
    <g id="icon-person"><circle class="icon" cx="0" cy="-7" r="6"/><path class="icon" d="M -10 11 C -10 1, 10 1, 10 11"/></g>
    <g id="icon-shield"><path class="icon" d="M 0 -12 L 10 -8 V 1 C 10 8, 5 12, 0 15 C -5 12, -10 8, -10 1 V -8 Z"/><path class="icon" d="M -4 1 L -1 4 L 5 -3"/></g>
    <g id="icon-sliders"><path class="icon" d="M -10 -8 H 10 M -10 0 H 10 M -10 8 H 10"/><circle cx="-3" cy="-8" r="2.5" fill="#FFFFFF" stroke="currentColor" stroke-width="2"/><circle cx="5" cy="0" r="2.5" fill="#FFFFFF" stroke="currentColor" stroke-width="2"/><circle cx="-1" cy="8" r="2.5" fill="#FFFFFF" stroke="currentColor" stroke-width="2"/></g>
    <g id="icon-app"><rect class="icon" x="-11" y="-10" width="22" height="20" rx="3"/><path class="icon" d="M -11 -4 H 11"/><circle cx="-7" cy="-7" r="1.2" fill="currentColor"/><circle cx="-3" cy="-7" r="1.2" fill="currentColor"/></g>
    <g id="icon-code"><path class="icon" d="M -4 -8 L -12 0 L -4 8 M 4 -8 L 12 0 L 4 8"/></g>
    <g id="icon-document"><path class="icon" d="M -8 -12 H 3 L 9 -6 V 12 H -8 Z M 3 -12 V -6 H 9 M -4 1 L -1 4 L 5 -3"/></g>
    <g id="icon-chat"><path class="icon" d="M -11 -9 H 11 V 7 H -3 L -9 12 V 7 H -11 Z"/></g>
    <g id="icon-bell"><path class="icon" d="M -9 7 H 9 L 6 3 V -3 C 6 -11, -6 -11, -6 -3 V 3 Z M -3 10 C -1 13, 1 13, 3 10"/></g>
    <g id="icon-nodes"><circle class="icon" cx="-8" cy="-7" r="3"/><circle class="icon" cx="9" cy="-1" r="3"/><circle class="icon" cx="-5" cy="9" r="3"/><path class="icon" d="M -5 -6 L 6 -2 M 6 1 L -3 7 M -7 -4 L -6 6"/></g>
    <g id="icon-guardian"><circle class="icon" cx="-5" cy="-6" r="5"/><circle class="icon" cx="7" cy="-2" r="3.5"/><path class="icon" d="M -14 11 C -14 2, 4 2, 4 11 M 2 11 C 2 5, 13 5, 13 11"/></g>
    <g id="icon-server"><rect class="icon" x="-11" y="-11" width="22" height="9" rx="2"/><rect class="icon" x="-11" y="2" width="22" height="9" rx="2"/><circle cx="-6" cy="-6.5" r="1.4" fill="currentColor"/><circle cx="-6" cy="6.5" r="1.4" fill="currentColor"/></g>
    <g id="icon-pulse"><path class="icon" d="M -13 2 H -7 L -3 -8 L 2 10 L 6 -3 H 13"/></g>
    <g id="icon-database"><ellipse class="icon" cx="0" cy="-8" rx="10" ry="4"/><path class="icon" d="M -10 -8 V 8 C -10 13, 10 13, 10 8 V -8 M -10 0 C -10 5, 10 5, 10 0"/></g>
    <g id="icon-cube"><path class="icon" d="M 0 -12 L 11 -6 V 7 L 0 13 L -11 7 V -6 Z M -11 -6 L 0 0 L 11 -6 M 0 0 V 13"/></g>
  </defs>

  <rect width="1950" height="1000" fill="#FAFAF8"/>
  <text class="title" x="40" y="48">WSO2 DPDP Accelerator overview</text>
  <text class="card-body" x="40" y="72">Consent, rights, grievance handling, and downstream lifecycle coordination</text>

  <!-- External Data Principal -->
  <g filter="url(#shadow)">
    <rect x="25" y="155" width="285" height="120" rx="18" fill="#FFFFFF" stroke="#FF7300" stroke-width="2.5"/>
    <text class="side-title" x="167.5" y="181" style="fill:#FF7300">EXTERNAL ACTOR</text>
    <rect class="icon-box" x="48" y="199" width="44" height="44" rx="11"/>
    <g transform="translate(70,221)" style="color:#FF7300"><use href="#icon-person"/></g>
    <text class="card-title" x="108" y="218">Data Principal</text>
    <text class="card-body" x="108" y="239">Individual or guardian</text>
  </g>

  <!-- Data Fiduciary -->
  <g filter="url(#shadow)">
    <rect x="25" y="350" width="285" height="430" rx="20" fill="#FFFFFF" stroke="#C7D5DC" stroke-width="1.5"/>
    <text class="side-title" x="167.5" y="379">DATA FIDUCIARY</text>
    <text class="section" x="43" y="410">INTERNAL EMPLOYEES</text>
    <rect class="side-card" x="43" y="425" width="249" height="66" rx="12"/><rect class="icon-box" x="60" y="436" width="44" height="44" rx="10"/><g transform="translate(82,458)" style="color:#FF7300"><use href="#icon-sliders"/></g><text class="side-entity-title" x="118" y="454">Organization admins</text><text class="card-body" x="118" y="474">Configure governance</text>
    <rect class="side-card" x="43" y="502" width="249" height="66" rx="12"/><rect class="icon-box" x="60" y="513" width="44" height="44" rx="10"/><g transform="translate(82,535)" style="color:#FF7300"><use href="#icon-shield"/></g><text class="side-entity-title" x="118" y="531">Data Protection Officer</text><text class="card-body" x="118" y="551">Handles grievances</text>
    <text class="section" x="43" y="601">OWNED SYSTEMS</text>
    <rect class="side-card" x="43" y="616" width="249" height="66" rx="12"/><rect class="icon-box" x="60" y="627" width="44" height="44" rx="10"/><g transform="translate(82,649)" style="color:#5B6B76"><use href="#icon-person"/></g><text class="side-entity-title" x="118" y="645">Customer onboarding</text><text class="card-body" x="118" y="665">Collects consent</text>
    <rect class="side-card" x="43" y="693" width="249" height="66" rx="12"/><rect class="icon-box" x="60" y="704" width="44" height="44" rx="10"/><g transform="translate(82,726)" style="color:#5B6B76"><use href="#icon-app"/></g><text class="side-entity-title" x="118" y="722">Web and mobile apps</text><text class="card-body" x="118" y="742">Exercise APIs and rights</text>
  </g>

  <!-- Accelerator boundary -->
  <g filter="url(#shadow)" transform="translate(65 0)">
    <rect x="335" y="95" width="1140" height="850" rx="24" fill="#FFFFFF" stroke="#16222B" stroke-width="2.5"/>
    <path d="M 335 119 Q 335 95, 359 95 H 1451 Q 1475 95, 1475 119 V 158 H 335 Z" fill="#16222B"/>
    <text class="brand" x="365" y="135">WSO</text><text x="415" y="132" style="font:700 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill:#FFFFFF;">2</text><line x1="432" y1="114" x2="432" y2="142" stroke="#8A97A0" stroke-width="1.5"/><text class="brand" x="450" y="135">Identity Server + DPDP Accelerator</text>

    <!-- Portals -->
    <rect class="group" x="360" y="175" width="1090" height="150" rx="16"/><text class="section" x="380" y="202">PORTALS — READY-MADE, RETHEMABLE UIs</text>
    <rect class="portal" x="380" y="218" width="335" height="84" rx="13"/><rect x="396" y="235" width="48" height="48" rx="11" fill="#FFFFFF"/><g transform="translate(420,259)" style="color:#FF7300"><use href="#icon-person"/></g><text class="card-title" x="460" y="253">Consent Portal</text><text class="card-body" x="460" y="276">Data Principal self-service</text>
    <rect class="portal" x="737" y="218" width="335" height="84" rx="13"/><rect x="753" y="235" width="48" height="48" rx="11" fill="#FFFFFF"/><g transform="translate(777,259)" style="color:#FF7300"><use href="#icon-sliders"/></g><text class="card-title" x="817" y="253">Admin Portal</text><text class="card-body" x="817" y="276">Elements, purposes, DPOs, processors</text>
    <rect class="portal" x="1094" y="218" width="336" height="84" rx="13"/><rect x="1110" y="235" width="48" height="48" rx="11" fill="#FFFFFF"/><g transform="translate(1134,259)" style="color:#FF7300"><use href="#icon-shield"/></g><text class="card-title" x="1174" y="253">DPO Portal</text><text class="card-body" x="1174" y="276">Grievance handling</text>

    <!-- APIs -->
    <rect class="group" x="360" y="340" width="1090" height="90" rx="16"/><rect class="feature" x="380" y="355" width="1050" height="60" rx="12"/><rect class="icon-box" x="396" y="363" width="44" height="44" rx="10"/><g transform="translate(418,385)" style="color:#5B6B76"><use href="#icon-code"/></g><text class="card-title" x="458" y="381">Consent APIs and SDKs</text><text class="card-body" x="458" y="402">Collect consent and serve rights from Data Fiduciary applications</text>

    <!-- Consent and governance services -->
    <rect class="group" x="360" y="445" width="1090" height="285" rx="16"/><text class="section" x="380" y="472">CONSENT AND GOVERNANCE SERVICES</text>
    <rect class="feature" x="380" y="488" width="510" height="74" rx="12"/><rect class="icon-box" x="394" y="503" width="44" height="44" rx="10"/><g transform="translate(416,525)" style="color:#FF7300"><use href="#icon-document"/></g><text class="card-title" x="454" y="520">Consent lifecycle</text><text class="card-body" x="454" y="543">Elements, purposes, expiry, delegation, nominee</text>
    <rect class="feature" x="910" y="488" width="520" height="74" rx="12"/><rect class="icon-box" x="924" y="503" width="44" height="44" rx="10"/><g transform="translate(946,525)" style="color:#FF7300"><use href="#icon-chat"/></g><text class="card-title" x="984" y="520">Rights and grievance</text><text class="card-body" x="984" y="543">Access, correction, erasure, revocation, complaints</text>
    <rect class="feature" x="380" y="574" width="510" height="74" rx="12"/><rect class="icon-box" x="394" y="589" width="44" height="44" rx="10"/><g transform="translate(416,611)" style="color:#FF7300"><use href="#icon-bell"/></g><text class="card-title" x="454" y="606">Notifications</text><text class="card-body" x="454" y="629">DPO alerts, consent-change and erasure events</text>
    <rect class="feature" x="910" y="574" width="520" height="74" rx="12"/><rect class="icon-box" x="924" y="589" width="44" height="44" rx="10"/><g transform="translate(946,611)" style="color:#FF7300"><use href="#icon-nodes"/></g><text class="card-title" x="984" y="606">Data Processor registry</text><text class="card-body" x="984" y="629">Register processors, secure callbacks, propagate events</text>
    <rect class="feature" x="380" y="660" width="1050" height="52" rx="12"/><rect class="icon-box" x="394" y="665" width="44" height="42" rx="10"/><g transform="translate(416,686)" style="color:#FF7300"><use href="#icon-guardian"/></g><text class="card-title" x="454" y="682">Children and guardian consent</text><text class="card-body" x="715" y="682">Verifiable guardian consent</text>

    <!-- Platform and data foundation -->
    <rect class="group" x="360" y="745" width="1090" height="180" rx="16"/><text class="section" x="380" y="772">PLATFORM AND DATA FOUNDATION</text>
    <rect class="feature" x="380" y="787" width="510" height="60" rx="12"/><rect x="394" y="795" width="44" height="44" rx="10" fill="#FF7300"/><g transform="translate(416,817)" style="color:#FFFFFF"><use href="#icon-server"/></g><text class="card-title" x="454" y="813">WSO2 Identity Server · CIAM</text><text class="card-body" x="454" y="834">Authentication, adaptive login, federation</text>
    <rect class="feature" x="910" y="787" width="520" height="60" rx="12"/><rect class="icon-box" x="924" y="795" width="44" height="44" rx="10"/><g transform="translate(946,817)" style="color:#5B6B76"><use href="#icon-pulse"/></g><text class="card-title" x="984" y="813">Audit and observability</text><text class="card-body" x="984" y="834">Tamper-evident logs and compliance evidence</text>
    <rect x="380" y="858" width="1050" height="52" rx="12" fill="#16222B"/><g transform="translate(410,884)" style="color:#FFFFFF"><use href="#icon-database"/></g><text x="438" y="880" style="font:600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill:#FFFFFF;">Encrypted data store</text><text x="438" y="899" style="font:400 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill:#C7D5DC;">Protected at rest and in transit; deployment-controlled residency</text>
    <rect class="pill" x="1115" y="872" width="92" height="25" rx="8"/><text class="pill-text" x="1161" y="889">consent records</text><rect class="pill" x="1217" y="872" width="88" height="25" rx="8"/><text class="pill-text" x="1261" y="889">personal data</text><rect class="pill" x="1315" y="872" width="96" height="25" rx="8"/><text class="pill-text" x="1363" y="889">audit history</text>
  </g>

  <!-- Contracted processors and third parties -->
  <g filter="url(#shadow)" transform="translate(110 0)">
    <rect x="1520" y="350" width="280" height="430" rx="20" fill="#FFFFFF" stroke="#C7D5DC" stroke-width="1.5"/><text class="side-title" x="1660" y="379">EXTERNAL · UNDER CONTRACT</text>
    <rect class="side-card" x="1538" y="407" width="244" height="78" rx="12"/><rect class="icon-box" x="1550" y="424" width="44" height="44" rx="10"/><g transform="translate(1572,446)" style="color:#5B6B76"><use href="#icon-server"/></g><text class="side-entity-title" x="1608" y="439">Data Processor</text><text class="card-body" x="1608" y="461">Analytics · CRM</text>
    <rect class="side-card" x="1538" y="500" width="244" height="78" rx="12"/><rect class="icon-box" x="1550" y="517" width="44" height="44" rx="10"/><g transform="translate(1572,539)" style="color:#5B6B76"><use href="#icon-nodes"/></g><text class="side-entity-title" x="1608" y="532">Data Processor</text><text class="card-body" x="1608" y="554">Marketing · billing</text>
    <rect class="side-card" x="1538" y="593" width="244" height="96" rx="12"/><rect class="icon-box" x="1550" y="619" width="44" height="44" rx="10"/><g transform="translate(1572,641)" style="color:#5B6B76"><use href="#icon-cube"/></g><text class="side-entity-title" x="1608" y="625">Third-party systems</text><text class="card-body" x="1608" y="647">Act on erasure</text><text class="card-body" x="1608" y="666">under contract</text>
    <text class="card-body" x="1660" y="724" text-anchor="middle">Registered, secured callback URLs</text><text class="card-body" x="1660" y="744" text-anchor="middle">control downstream delivery</text>
  </g>

  <!-- Relationships -->
  <path class="connector" d="M 310 221 H 355 V 260 H 400"/><text class="flow-label" x="355" y="207">self-service</text>
  <path class="callback" d="M 310 520 H 400"/><path class="callback" d="M 400 550 H 310"/><text class="flow-label" x="355" y="487">MANAGE</text><text class="flow-label" x="355" y="502">INTEGRATE</text>
  <path class="callback" d="M 1540 522 H 1630"/><path class="callback" d="M 1630 552 H 1540"/><text class="flow-label" x="1585" y="487" style="font-size:9px; font-weight:700; letter-spacing:0.3px">CONSENT + ERASURE</text><text class="flow-label" x="1585" y="502" style="font-size:9px; font-weight:700; letter-spacing:0.3px">SECURED CALLBACKS</text>
</svg>
