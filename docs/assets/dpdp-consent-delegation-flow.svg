<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
  <title id="title">DPDP delegated-consent authorization flow</title>
  <desc id="desc">A connected application creates a consent for a data subject and lists a verified guardian or delegate as an authorizer. The Consent Management API stores the consent as pending. The authorizer signs in to the Consent Portal, finds the consent under My Pending Consents, and approves it. After all required authorizers approve, the consent becomes active. The data subject can then inspect the consent and its authorization state. Relationship verification occurs outside the Consent Management API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B76"/>
    </marker>
    <style>
      .actor-label { font: 600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #16222B; text-anchor: middle; }
      .actor-sub   { font: 400 12.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8A97A0; text-anchor: middle; }
      .step-label  { font: 500 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #3A4750; }
      .step-num    { font: 700 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; }
      .icon        { fill: none; stroke: #FF7300; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .lifeline    { stroke: #DCE1E4; stroke-width: 2; stroke-dasharray: 4 5; }
      .arrow       { fill: none; stroke: #5B6B76; stroke-width: 2; marker-end: url(#arrow); }
    </style>

    <g id="icon-app">
      <rect class="icon" x="-22" y="-20" width="44" height="38" rx="5"/>
      <line class="icon" x1="-22" y1="-8" x2="22" y2="-8"/>
      <circle cx="-15" cy="-14" r="1.8" fill="#FF7300"/>
      <circle cx="-9" cy="-14" r="1.8" fill="#FF7300"/>
    </g>
    <g id="icon-api">
      <path class="icon" d="M -6 -15 L -20 0 L -6 15 M 6 -15 L 20 0 L 6 15"/>
    </g>
    <g id="icon-portal">
      <rect class="icon" x="-22" y="-20" width="44" height="38" rx="5"/>
      <line class="icon" x1="-22" y1="-8" x2="22" y2="-8"/>
      <path class="icon" d="M -11 2 H 11 M -11 9 H 5"/>
    </g>
    <g id="icon-guardian">
      <circle class="icon" cx="-6" cy="-10" r="9"/>
      <circle class="icon" cx="11" cy="-5" r="6"/>
      <path class="icon" d="M -21 20 C -21 3, 9 3, 9 20 M 5 20 C 5 9, 22 9, 22 20"/>
    </g>
    <g id="icon-person">
      <circle class="icon" cx="0" cy="-10" r="11"/>
      <path class="icon" d="M -18 20 C -18 2, 18 2, 18 20"/>
    </g>
  </defs>

  <rect width="1200" height="830" fill="#FAFAF8"/>
  <text x="40" y="40" style="font:700 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill:#16222B; text-anchor:start;">DPDP delegated-consent authorization flow</text>
  <text x="40" y="64" style="font:400 12.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill:#8A97A0; text-anchor:start;">A verified guardian or delegate approves a consent on behalf of its data subject</text>

  <!-- Actor headers -->
  <g transform="translate(100,120)"><use href="#icon-app"/></g>
  <text x="100" y="170" class="actor-label">Connected Application</text>
  <text x="100" y="188" class="actor-sub">Creates delegated consent</text>

  <g transform="translate(350,120)"><use href="#icon-api"/></g>
  <text x="350" y="170" class="actor-label">Consent Management API</text>
  <text x="350" y="188" class="actor-sub">Stores and resolves state</text>

  <g transform="translate(600,120)"><use href="#icon-portal"/></g>
  <text x="600" y="170" class="actor-label">Consent Portal</text>
  <text x="600" y="188" class="actor-sub">Self-service review</text>

  <g transform="translate(850,120)"><use href="#icon-guardian"/></g>
  <text x="850" y="170" class="actor-label">Guardian / Authorizer</text>
  <text x="850" y="188" class="actor-sub">Acts for the data subject</text>

  <g transform="translate(1100,120)"><use href="#icon-person"/></g>
  <text x="1100" y="170" class="actor-label">Data Subject</text>
  <text x="1100" y="188" class="actor-sub">Person the consent concerns</text>

  <!-- Lifelines -->
  <line class="lifeline" x1="100" y1="205" x2="100" y2="700"/>
  <line class="lifeline" x1="350" y1="205" x2="350" y2="700"/>
  <line class="lifeline" x1="600" y1="205" x2="600" y2="700"/>
  <line class="lifeline" x1="850" y1="205" x2="850" y2="700"/>
  <line class="lifeline" x1="1100" y1="205" x2="1100" y2="700"/>

  <!-- Step 1: application creates delegated consent -->
  <path class="arrow" d="M 100 245 H 350"/>
  <circle cx="100" cy="245" r="11" fill="#16222B"/>
  <text x="100" y="249" class="step-num">1</text>
  <text x="225" y="235" class="step-label" text-anchor="middle">Create subject + guardian authorization</text>

  <!-- Step 2: API records pending state -->
  <path class="arrow" d="M 350 300 C 405 300, 405 326, 352 326"/>
  <circle cx="350" cy="300" r="11" fill="#16222B"/>
  <text x="350" y="304" class="step-num">2</text>
  <text x="415" y="317" class="step-label" text-anchor="start">Store consent as PENDING</text>

  <!-- Step 3: guardian opens portal -->
  <path class="arrow" d="M 850 375 H 600"/>
  <circle cx="850" cy="375" r="11" fill="#16222B"/>
  <text x="850" y="379" class="step-num">3</text>
  <text x="725" y="365" class="step-label" text-anchor="middle">Open My Pending Consents</text>

  <!-- Step 4: portal loads authorizer relationship -->
  <path class="arrow" d="M 600 430 H 350"/>
  <circle cx="600" cy="430" r="11" fill="#16222B"/>
  <text x="600" y="434" class="step-num">4</text>
  <text x="475" y="420" class="step-label" text-anchor="middle">Load relation=AUTHORIZER</text>

  <!-- Step 5: guardian approves -->
  <path class="arrow" d="M 850 490 H 600"/>
  <circle cx="850" cy="490" r="11" fill="#16222B"/>
  <text x="850" y="494" class="step-num">5</text>
  <text x="725" y="480" class="step-label" text-anchor="middle">Review purposes and approve</text>

  <!-- Step 6: portal records guardian decision -->
  <path class="arrow" d="M 600 550 H 350"/>
  <circle cx="600" cy="550" r="11" fill="#16222B"/>
  <text x="600" y="554" class="step-num">6</text>
  <text x="475" y="540" class="step-label" text-anchor="middle">POST /authorize → APPROVED</text>

  <!-- Step 7: API activates aggregate consent -->
  <path class="arrow" d="M 350 605 C 405 605, 405 631, 352 631"/>
  <circle cx="350" cy="605" r="11" fill="#16222B"/>
  <text x="350" y="609" class="step-num">7</text>
  <text x="415" y="622" class="step-label" text-anchor="start">All required approvals → ACTIVE</text>

  <!-- Step 8: subject checks their consent -->
  <path class="arrow" d="M 1100 675 H 600"/>
  <circle cx="1100" cy="675" r="11" fill="#16222B"/>
  <text x="1100" y="679" class="step-num">8</text>
  <text x="850" y="665" class="step-label" text-anchor="middle">Inspect My Own consent and authorization state</text>

  <!-- Footer boundary note -->
  <rect x="40" y="720" width="1120" height="80" rx="14" fill="#16222B"/>
  <text x="70" y="752" fill="#C7D5DC" style="font:400 14px 'Segoe UI', Helvetica, Arial, sans-serif;">The Consent API records the subject, authorizer, authorization type, and decision; it does not establish a family or legal relationship.</text>
  <text x="70" y="776" fill="#C7D5DC" style="font:400 14px 'Segoe UI', Helvetica, Arial, sans-serif;">Verify the guardian/delegate relationship in the Data Fiduciary's trusted system before creating the authorization.</text>
</svg>
