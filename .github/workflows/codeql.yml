# Static analysis for the Java bundles and the consent portal's TypeScript.
#
# The weekly schedule is not redundant with the PR and push runs: CodeQL ships
# new queries continuously, and the schedule is what applies them to code that
# has not changed since it was last scanned.
#
# build-mode: none means CodeQL analyses the Java sources without building the
# reactor, keeping this in minutes rather than competing with the real build. It
# costs some accuracy on generated code, which is an acceptable trade for a
# scanner that also has to run on every PR.
#
# This is "advanced setup". GitHub's default CodeQL setup must stay disabled in
# Settings -> Code security, or it rejects these uploads - see #80.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '30 2 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # Not needed while the repository is public, but code scanning requires it if
      # it is ever made private - cheaper to carry than to debug later.
      actions: read
    strategy:
      # One language failing should not hide the other's findings.
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: '/language:${{ matrix.language }}'
