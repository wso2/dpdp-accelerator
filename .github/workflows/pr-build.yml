# Build-and-unit-test gate for every PR. Runs under plain `pull_request` only -
# fork-safe (no secrets, read-only token) and always on. The E2E side lives in
# pr-e2e-gate.yml / pr-e2e.yml under pull_request_target; keeping the two event
# types in separate files is what stops every push from littering the PR with
# "skipped" check runs for the other trigger's jobs (the previous single
# pr-checks.yml carried both triggers and reported all four of its jobs on every
# one of the three runs a labelled push produced).
#
# `pull_request` checks out the merge ref (the PR merged onto the current base)
# by default, so these jobs test the merge result rather than the branch tip.
name: PR build

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dpdp-accelerator/react-apps/consent-portal/frontend/package-lock.json

      # Runs the Java unit tests and their jacoco gates, the frontend
      # tsc/security:verify/i18n:verify chain, and the frontend Vitest suite
      # (bound to the Maven test phase in the consent-portal pom).
      - name: Build
        run: mvn -B -ntp clean install
        env:
          MAVEN_OPTS: -Xmx4g

  # Style-only checks, deliberately outside the Maven build so a formatting nit
  # never blocks a local `mvn install`.
  #
  # Two things this job does NOT do yet, both because the tree cannot pass them
  # today and a permanently-red check is worse than no check:
  #
  #   - `npm ci` instead of `npm install`, which would additionally catch
  #     package.json / package-lock.json drift. The committed lockfile has no
  #     esbuild entries at all (vite 7.3.5 needs it, and package.json overrides
  #     it to 0.28.1 for a CVE), so `npm ci` fails outright on it.
  #   - `npm run lint`. There are 23 pre-existing ESLint violations
  #     (react/require-default-props, class-methods-use-this, react-hooks and
  #     friends) needing real code changes, and CLAUDE.md forbids disabling the
  #     rules to paper over them.
  #
  # Both are tracked in #81; add the steps in the change that fixes them.
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dpdp-accelerator/react-apps/consent-portal/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dpdp-accelerator/react-apps/consent-portal/frontend/package-lock.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Format check
        run: npm run format:check

  # The E2E suite itself only runs behind the Action/trigger-e2e label (pr-e2e.yml) and needs a
  # live Identity Server. These two checks need neither, so they gate every PR instead - otherwise
  # a numbering or typing regression lands unreviewed on any unlabelled push.
  e2e-suite-quality:
    name: E2E suite quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dpdp-integration-test-suite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dpdp-integration-test-suite/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # Playwright transpiles with esbuild and never typechecks, so a bad import fails at runtime
      # and reports as "0 tests in 0 files" across the whole suite rather than as one broken spec.
      - name: Typecheck
        run: npm run typecheck

      # Enforces the numbering rules in the suite's AGENTS.md, and that TEST-SCENARIOS.md still
      # matches the tree.
      - name: Verify test IDs and scenario catalogue
        run: npm run verify:ids
