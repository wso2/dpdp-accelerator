# Deploys a fresh Identity Server, applies the accelerator to it and runs the Playwright
# suite against it. Reusable so `pr-e2e.yml` (label-gated PR runs) and
# `release-builder.yml` (release gate) exercise exactly the same path.
name: E2E integration tests

on:
  workflow_call:
    inputs:
      ref:
        description: Ref or SHA to check out. Empty means the ref that triggered the caller.
        required: false
        type: string
        default: ''
      expected_head_sha:
        description: >-
          When `ref` is a PR merge ref: the PR head commit the maintainer actually
          reviewed and labelled. The job fails if the merge ref turns out to carry a
          different one, i.e. the PR moved after the label was applied. Empty skips
          the check.
        required: false
        type: string
        default: ''
      is_source:
        description: Where to get the Identity Server pack from - `s3` or `master`.
        required: false
        type: string
        default: s3
      db_type:
        description: >-
          Database the Identity Server runs on - any type with a block in the accelerator's
          repository/conf/dbprofiles.properties, currently `h2` or `mysql`. The accelerator
          ships `h2` so a fresh install needs no database server; CI defaults to `mysql`
          because that is what a real deployment uses, and because Identity Server 7.3
          disables Basic auth on any deployment whose root organization postdates
          2026-08-13 - true of every MySQL install, so it is the path worth guarding.
        required: false
        type: string
        default: mysql
      allow_unsafe_pr_checkout:
        description: Permit checking out fork code. Only ever true for a reviewed, label-gated PR.
        required: false
        type: boolean
        default: false
    secrets:
      SOLUTIONS_BOT_EMAIL:
        required: false
      SOLUTIONS_BOT_U2_PASSWORD:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      IS_PACK_S3_URI:
        required: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  e2e:
    name: E2E integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      IS_BASE_URL: https://localhost:9443
      # Must match repository/conf/configure.properties - the accelerator's own configure.sh
      # installs the admin account under these credentials, not the product's stock admin/admin.
      IS_ADMIN_USERNAME: admin@wso2.com
      IS_ADMIN_PASSWORD: wso2123
      IS_SOURCE: ${{ inputs.is_source }}
      DB_TYPE: ${{ inputs.db_type }}
    steps:
      # pull_request_target checks out the TARGET branch by default, which would
      # silently test the wrong code. Callers therefore pass an explicit ref:
      # pr-e2e.yml passes refs/pull/N/merge, so E2E exercises the PR merged onto the
      # current base rather than the branch tip - a PR can be green in isolation and
      # still break the base on merge. A plain workflow_dispatch run has no
      # pull_request context and falls back to whatever ref triggered it
      # (actions/checkout's own default).
      #
      # fetch-depth 2 is what makes the merge ref's parents resolvable for the guard
      # step below; the default depth-1 clone has no second parent to compare.
      #
      # allow-unsafe-pr-checkout is required because that merge ref can contain fork
      # code - actions/checkout otherwise refuses to fetch it into a
      # pull_request_target run (the "pwn request" guard). Safe here specifically
      # because this job only runs after a maintainer has reviewed the diff and
      # applied the Action/trigger-e2e label (see pr-e2e.yml's trigger comment and
      # pr-e2e-gate.yml) - the same pattern FS Accelerator's maven.yml uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.expected_head_sha != '' && 2 || 1 }}
          allow-unsafe-pr-checkout: ${{ inputs.allow_unsafe_pr_checkout }}
          persist-credentials: false

      # refs/pull/N/merge is recomputed by GitHub whenever the PR moves, and the label
      # authorised one specific head commit. If the author pushed in the window between
      # the label event and this checkout - before pr-e2e-gate.yml's own run stripped
      # the label - the merge ref would already carry unreviewed code. Refuse to run it
      # under a write-capable token.
      #
      # The check fails closed, so it can also fire benignly: the recomputation is
      # asynchronous, and labelling within a second or two of a push can find the merge
      # ref still pointing at the previous head. Re-applying the label is the fix in
      # both cases, which is why the message says so rather than naming a cause.
      #
      # A PR with merge conflicts has no refs/pull/N/merge at all; the checkout above
      # fails first, with git's own "couldn't find remote ref" - unmergeable is not
      # something this job can meaningfully test around.
      - name: Verify the merge ref carries the labelled head commit
        if: inputs.expected_head_sha != ''
        env:
          EXPECTED: ${{ inputs.expected_head_sha }}
        run: |
          actual=$(git rev-parse HEAD^2)
          if [ "${actual}" != "${EXPECTED}" ]; then
            echo "::error::The merge ref does not carry the commit Action/trigger-e2e was" \
                 "applied to (labelled ${EXPECTED}, merge ref carries ${actual}). Either the" \
                 "PR moved after it was labelled, or GitHub had not yet recomputed the merge" \
                 "ref. Re-apply the label - reviewing the diff again first if the PR moved."
            exit 1
          fi
          echo "Merge ref second parent matches the labelled head ${EXPECTED}."

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dpdp-integration-test-suite/package-lock.json

      # No artifact reuse from the PR build: that job lives in pr-build.yml under a
      # different event, so its run never overlaps this one and there is nothing to
      # download. This job builds the accelerator itself.
      - name: Build the accelerator
        run: mvn -B -ntp clean install
        env:
          MAVEN_OPTS: -Xmx4g

      # --- Obtaining the IS pack: two mutually exclusive paths ------------------

      # The URI is a secret so the pack can be repointed without a code change, which also
      # keeps it out of the key - hence a digest. Repointing invalidates the cache.
      # Nothing else is in the key, and entries are LRU-evicted and expire after 7 days, so
      # this cannot pin an update level. Force a refresh with `gh cache delete <key>`.
      - name: Derive the pack cache key
        id: packkey
        if: env.IS_SOURCE == 's3'
        env:
          IS_PACK_S3_URI: ${{ secrets.IS_PACK_S3_URI }}
        run: |
          if [ -z "${IS_PACK_S3_URI}" ]; then
            echo "::error::IS_PACK_S3_URI is empty - it must be configured as a repository" \
                 "secret holding the full s3:// URI of the U2-updatable Identity Server pack."
            exit 1
          fi
          digest=$(printf '%s' "${IS_PACK_S3_URI}" | sha256sum | cut -c1-12)
          echo "key=is-pack-${digest}" >> "$GITHUB_OUTPUT"

      # Holds the pack with U2 already applied, so a hit skips download, unzip and update.
      # Read-only: this job runs PR code, and a job that can write the cache can poison the
      # pack for every later run, the release gate included. Only the save step below writes.
      - name: Restore the updated IS pack
        id: is-cache
        if: env.IS_SOURCE == 's3'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/is-pack/updated.tar.zst
          key: ${{ steps.packkey.outputs.key }}

      - name: Download the IS pack from S3
        if: env.IS_SOURCE == 's3' && steps.is-cache.outputs.cache-hit != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          IS_PACK_S3_URI: ${{ secrets.IS_PACK_S3_URI }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::error::AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY are empty - both must be" \
                 "configured as repository secrets for the default S3 path to work."
            exit 1
          fi
          mkdir -p ~/is-pack
          # AWS CLI v2 is preinstalled on the runner image.
          if ! aws s3 cp "${IS_PACK_S3_URI}" ~/is-pack/wso2is.zip --no-progress; then
            echo "::error::Could not fetch the pack from S3. If the failure mentions" \
                 "PermanentRedirect the bucket is not in ${AWS_REGION} - set the AWS_REGION" \
                 "env in this workflow to the bucket's actual region. Otherwise check that" \
                 "the IAM user still has s3:GetObject on the object IS_PACK_S3_URI names."
            exit 1
          fi
          # No .sha256 in the bucket, so this replaces the checksum the release path had:
          # catch a truncated transfer here, not later as a mystery startup error.
          unzip -tq ~/is-pack/wso2is.zip

      # No Maven cache for this build on purpose. It ran on every labelled PR once, where a
      # warm ~/.m2 cut the build from ~25 minutes to ~3; now only the weekly job takes this
      # path, and entries expire after 7 days unread, so a weekly cadence sits exactly on
      # that boundary and would miss about as often as it hit. Keeping it meant writing a
      # 2.19GB entry weekly against a 10GB budget - crowding out the pack entry that PR runs
      # actually restore, to speed up a scheduled job nobody waits for.
      - name: Build IS from product-is master
        if: env.IS_SOURCE == 'master'
        run: |
          git clone --depth 1 https://github.com/wso2/product-is.git /tmp/product-is
          cd /tmp/product-is
          mvn -B -ntp install \
            -Dmaven.test.skip=true -Dspotbugs.skip=true -Dcheckstyle.skip=true \
            -Dpmd.skip=true -Drat.skip=true -Dlicense.skip=true \
            -Dmaven.javadoc.skip=true -Djacoco.skip=true
        env:
          MAVEN_OPTS: -Xmx4g

      # product-is builds two archives into this directory: the runtime distribution and
      # a source distribution, wso2is-<version>-src.zip. Both match `wso2is-*.zip`, and
      # `find` lists them in filesystem order rather than sorted - so taking the first
      # match staged one or the other essentially at random. A run that drew the source
      # zip unpacked a source tree, pointed IS_HOME at it and failed several steps later
      # in merge.sh with "not a valid Carbon product path", which reads like a packaging
      # bug rather than the wrong input. Exclude the source archive and sort, so the
      # choice is both correct and reproducible.
      - name: Stage the built distribution zip
        if: env.IS_SOURCE == 'master'
        run: |
          zips=$(find /tmp/product-is/modules/distribution/target -maxdepth 1 \
            -name "wso2is-*.zip" ! -name "*-src.zip" | sort)
          count=$(echo "${zips}" | grep -c . || true)
          if [ "${count}" -eq 0 ]; then
            echo "::error::No runtime wso2is-*.zip under modules/distribution/target" \
                 "(source distributions are excluded) - did the module path change?"
            ls -1 /tmp/product-is/modules/distribution/target/*.zip 2>/dev/null || true
            exit 1
          fi
          if [ "${count}" -gt 1 ]; then
            echo "::error::Expected one runtime distribution zip, found ${count} - refusing" \
                 "to guess which to test:"
            echo "${zips}" >&2
            exit 1
          fi
          zip_path="${zips}"
          mkdir -p ~/is-pack
          cp "${zip_path}" ~/is-pack/wso2is.zip
          echo "Staged $(basename "${zip_path}")"

      # Master path and S3 cache miss both. On the master path the restore never ran, so
      # cache-hit is empty and this is effectively unconditional.
      - name: Unpack IS
        if: steps.is-cache.outputs.cache-hit != 'true'
        run: unzip -q ~/is-pack/wso2is.zip -d "${GITHUB_WORKSPACE}"

      # Lands the same tree the download-and-update sequence would have produced.
      - name: Unpack the cached updated pack
        if: steps.is-cache.outputs.cache-hit == 'true'
        run: tar --zstd -xf ~/is-pack/updated.tar.zst -C "${GITHUB_WORKSPACE}"

      - name: Resolve IS_HOME
        run: |
          # An unpacked source distribution matches this glob as readily as the runtime
          # pack, and an unquoted multi-line result would have silently produced an
          # unusable IS_HOME, so exclude it and insist on exactly one match.
          dirs=$(find "${GITHUB_WORKSPACE}" -maxdepth 1 -type d -name "wso2is-*" ! -name "*-src" | sort)
          count=$(echo "${dirs}" | grep -c . || true)
          if [ "${count}" -eq 0 ]; then
            echo "::error::No runtime wso2is-* directory after unpacking. A source" \
                 "distribution alone does not count - check which zip was staged."
            ls -1d "${GITHUB_WORKSPACE}"/wso2is-* 2>/dev/null || true
            exit 1
          fi
          if [ "${count}" -gt 1 ]; then
            echo "::error::Expected one unpacked product directory, found ${count}:"
            echo "${dirs}" >&2
            exit 1
          fi
          # Assert it really is a runtime pack. Without this the first symptom of a wrong
          # pack is merge.sh's "not a valid Carbon product path" much further down.
          dir="${dirs}"
          if [ ! -f "${dir}/bin/wso2server.sh" ]; then
            echo "::error::${dir} has no bin/wso2server.sh, so it is not a runtime" \
                 "Identity Server pack."
            exit 1
          fi
          echo "IS_HOME=${dir}" >> "$GITHUB_ENV"
          echo "Resolved IS_HOME=${dir}"

      # Without the update, a GA pack lacks the consent-mgt v2 API resources the accelerator
      # needs. Skipped on a cache hit (already updated) and on master (already newest).
      - name: Apply WSO2 U2 updates
        if: env.IS_SOURCE == 's3' && steps.is-cache.outputs.cache-hit != 'true'
        env:
          WSO2_USERNAME: ${{ secrets.SOLUTIONS_BOT_EMAIL }}
          WSO2_PASSWORD: ${{ secrets.SOLUTIONS_BOT_U2_PASSWORD }}
        run: |
          if [ -z "${WSO2_USERNAME}" ] || [ -z "${WSO2_PASSWORD}" ]; then
            echo "::error::WSO2_USERNAME/WSO2_PASSWORD are empty - SOLUTIONS_BOT_EMAIL and" \
                 "SOLUTIONS_BOT_U2_PASSWORD must be configured as repository secrets for the" \
                 "default S3+U2 path to work."
            exit 1
          fi
          # Assert rather than let bash report a missing file and leave the reader guessing.
          if [ ! -f "$IS_HOME/bin/update_tool_setup.sh" ]; then
            echo "::error::${IS_HOME}/bin/update_tool_setup.sh is missing, so this pack is" \
                 "not U2-updatable. IS_PACK_S3_URI may be pointing at a plain GA pack" \
                 "rather than the updates2.0 build."
            exit 1
          fi
          cd "$IS_HOME"
          # Downloads bin/wso2update_linux into the pack if not already present.
          bash bin/update_tool_setup.sh
          # One retry: the updater is network-flaky, which is why FSA retries it too.
          bin/wso2update_linux -v --username "$WSO2_USERNAME" --password "$WSO2_PASSWORD" \
            || bin/wso2update_linux -v --username "$WSO2_USERNAME" --password "$WSO2_PASSWORD"

      # This tree becomes a cache entry any later run can restore, so record what the
      # updater put in it. Paths and sizes only, never contents.
      - name: Inspect what U2 left in IS_HOME
        if: env.IS_SOURCE == 's3' && steps.is-cache.outputs.cache-hit != 'true'
        run: |
          echo "Total size:"; du -sh "${IS_HOME}"
          echo "Largest directories:"
          du -sh "${IS_HOME}"/* 2>/dev/null | sort -rh | head -15
          echo "Update-tool state:"
          find "${IS_HOME}" -maxdepth 3 -iname '*update*' -printf '%y %10s %p\n' 2>/dev/null | head -30

      # Interlock: a cached entry is restorable by every later run, so refuse to save one
      # carrying a U2 credential rather than leak it quietly. Prints paths, never contents.
      - name: Package the updated pack for the cache
        id: packpack
        if: >-
          env.IS_SOURCE == 's3' && steps.is-cache.outputs.cache-hit != 'true' &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
           github.event_name == 'push')
        env:
          WSO2_USERNAME: ${{ secrets.SOLUTIONS_BOT_EMAIL }}
          WSO2_PASSWORD: ${{ secrets.SOLUTIONS_BOT_U2_PASSWORD }}
        run: |
          # Prune first so the check below sees exactly what gets archived. updates/logs is
          # the updater's own log, which records the account it authenticated as - per-run
          # noise, and what tripped this check on its first run.
          rm -rf "${IS_HOME}/repository/logs"/* "${IS_HOME}/updates/logs"/*
          for secret in "${WSO2_USERNAME}" "${WSO2_PASSWORD}"; do
            [ -n "${secret}" ] || continue
            hits=$(grep -rlF -e "${secret}" "${IS_HOME}" 2>/dev/null || true)
            if [ -n "${hits}" ]; then
              echo "::error::A U2 credential appears in the files below, so this pack will" \
                   "not be cached. Exclude them, then re-run:"
              echo "${hits}" | head -20
              exit 1
            fi
          done
          # --zstd, not `-I zstd`: -I means --include on bsdtar, --use-compress-program on
          # GNU tar. The long option means the same thing in both.
          tar --zstd -cf ~/is-pack/updated.tar.zst \
            -C "${GITHUB_WORKSPACE}" "$(basename "${IS_HOME}")"
          ls -lh ~/is-pack/updated.tar.zst

      # Only the events GitHub lets write the default branch's cache scope - deliberately
      # not the labelled-PR path. So a dispatch or the release gate warms the entry, and a
      # PR that misses updates inline without publishing the result.
      - name: Save the updated IS pack
        if: steps.packpack.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/is-pack/updated.tar.zst
          key: ${{ steps.packkey.outputs.key }}

      # Placed after both paths converge: a warm-cache run skips the update step entirely
      # and so emits no U2 output, leaving this the only record of the level actually under
      # test - which is the question the weekly refresh exists to move.
      - name: Report the IS update level
        run: |
          cfg="${IS_HOME}/updates/config.json"
          if [ ! -f "${cfg}" ]; then
            echo "No updates/config.json - not a U2-updated pack (expected on the master path)."
            exit 0
          fi
          level=$(CFG="${cfg}" python3 -c \
            'import json, os; print(json.load(open(os.environ["CFG"]))["update-level"])')
          echo "IS update level: ${level}"
          echo "IS update level \`${level}\`" >> "$GITHUB_STEP_SUMMARY"

      # The runner image ships MySQL 8 stopped, with root/root - which is already what the
      # accelerator's configure.properties expects, so only DB_TYPE below needs changing.
      - name: Start MySQL
        if: inputs.db_type == 'mysql'
        run: |
          sudo systemctl start mysql
          for _ in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root -proot --silent 2>/dev/null && break
            sleep 2
          done
          mysql -h 127.0.0.1 -u root -proot -e 'SELECT VERSION();' \
            || { echo "::error::MySQL did not become reachable on the runner"; exit 1; }

      - name: Apply the accelerator
        run: |
          zip_path=$(find dpdp-accelerator/accelerators/dpdp-is/target -maxdepth 1 -name "wso2-dpdpiam-accelerator-*.zip" | head -1)
          if [ -z "${zip_path}" ]; then
            echo "::error::No wso2-dpdpiam-accelerator-*.zip under dpdp-accelerator/accelerators/dpdp-is/target"
            exit 1
          fi
          unzip -q "${zip_path}" -d "$IS_HOME"
          cd "${IS_HOME}/$(basename "${zip_path}" .zip)"

          # configure.properties is the accelerator's own knob for this and it ships `h2`, so
          # selecting a database here is an edit to that file rather than a new mechanism.
          # configure.sh sources it, which would discard anything exported into the environment.
          properties="repository/conf/configure.properties"
          sed -i -E "s/^DB_TYPE=.*/DB_TYPE=${DB_TYPE}/" "${properties}"
          grep -qx "DB_TYPE=${DB_TYPE}" "${properties}" \
            || { echo "::error::could not set DB_TYPE=${DB_TYPE} in ${properties}"; exit 1; }
          echo "Installing against ${DB_TYPE}"
          echo "Database \`${DB_TYPE}\`" >> "$GITHUB_STEP_SUMMARY"

          bash bin/merge.sh     "$IS_HOME"
          bash bin/configure.sh "$IS_HOME"

      # The workflow this job was lifted from has an "Enable private-network webhook
      # callbacks" step here, calling
      # dpdp-integration-test-suite/scripts/enable-webhook-callbacks.sh. That script is
      # not in the repository, so the step is omitted rather than carried as a guaranteed
      # failure. Nothing is lost today: it flips allow_private_network_callback_targets for
      # tests/08-event-notifications, whose webhook specs are test.skip'd in source and also
      # gated on WEBHOOK_RECEIVER_HOST, which nothing here sets. Re-add it at this point in the
      # sequence - after configure.sh, before the server starts - once the script lands.

      - name: Start the Identity Server
        run: |
          "${IS_HOME}/bin/wso2server.sh" start
          for i in $(seq 1 60); do
            if curl -sk -o /dev/null -f "${IS_BASE_URL}/oauth2/jwks"; then
              echo "Identity Server ready after ~$((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Identity Server did not become ready within 300s"
          tail -200 "${IS_HOME}/repository/logs/wso2carbon.log"
          exit 1

      # Moved ahead of provisioning: the bootstrap below signs in through a real browser, so the
      # suite's dependencies and Chromium have to exist before the first authenticated call, not
      # after it.
      - name: Install the suite's dependencies
        working-directory: dpdp-integration-test-suite
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The suite's one configuration file: e2e-config.json holds every default, and this local
      # override supplies only what is generated per run. Written before provisioning, which now
      # reads the account password from here rather than taking it as an environment variable.
      - name: Configure the suite
        working-directory: dpdp-integration-test-suite
        run: |
          # Ephemeral - thrown away with the runner - but masked so it cannot reach a log.
          password="$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9')Aa1!"
          echo "::add-mask::${password}"
          PASSWORD="${password}" WEBHOOK_HOST="${WEBHOOK_RECEIVER_HOST}" python3 - <<'PYEOF'
          import json, os

          password = os.environ['PASSWORD']
          config = {
              'personas': {
                  name: {'password': password} for name in ('user', 'user2', 'consentAdmin')
              },
              'webhook': {
                  'receiverHost': os.environ['WEBHOOK_HOST'] or None,
                  'allowPrivateNetwork': True,
              },
          }
          with open('e2e-config.local.json', 'w') as handle:
              json.dump(config, handle, indent=2)
              handle.write('\n')
          PYEOF

      # Identity Server 7.3 disables Basic auth for deployments whose root organization was
      # created on or after 2026-08-13 (see compatibility-settings-metadata.json). That is every
      # backend except the shipped H2 file, whose root org is stamped at WSO2's build time - so
      # every authenticated call below uses a client_credentials token instead, which behaves the
      # same on all of them. See scripts/bootstrap-provisioning-app.ts.
      - name: Bootstrap the provisioning client
        working-directory: dpdp-integration-test-suite
        run: npm run --silent bootstrap:provisioning-app

      - name: Verify accelerator provisioning
        run: |
          # Written by the bootstrap step above. It lives here rather than under .auth/ because
          # the suite's global teardown removes that whole directory after every run.
          creds="dpdp-integration-test-suite/e2e-config.local.json"
          read_cred() {
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["provisioningClient"][sys.argv[2]])' \
              "${creds}" "$1"
          }
          client_id="$(read_cred clientId)"
          client_secret="$(read_cred clientSecret)"
          token="$(curl -sk -X POST "${IS_BASE_URL}/oauth2/token" \
            -u "${client_id}:${client_secret}" \
            -d grant_type=client_credentials \
            --data-urlencode 'scope=internal_role_mgt_view' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')"
          if [ -z "${token}" ]; then
            echo "::error::could not mint a token for the provisioning client"
            exit 1
          fi
          roles_found() {
            curl -sk -H "Authorization: Bearer ${token}" \
              "${IS_BASE_URL}/scim2/v2/Roles?filter=displayName+eq+dpdp-consent-admin" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("totalResults", 0))'
          }
          wait_for_is() {
            for _ in $(seq 1 60); do
              curl -sk -o /dev/null -f "${IS_BASE_URL}/oauth2/jwks" && return 0
              sleep 5
            done
            return 1
          }

          max_restarts=1
          attempt=0
          while [ "$(roles_found)" != "1" ]; do
            if [ "${attempt}" -ge "${max_restarts}" ]; then
              echo "::error::Accelerator did not provision dpdp-consent-admin for carbon.super after ${max_restarts} restarts"
              grep -n "Error provisioning the DPDP Consent Portal" \
                "${IS_HOME}/repository/logs/wso2carbon.log" || true
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "::warning::dpdp-consent-admin missing after startup; restart ${attempt}/${max_restarts}"
            "${IS_HOME}/bin/wso2server.sh" restart
            wait_for_is || { echo "::error::Identity Server did not come back up after restart ${attempt}"; exit 1; }
          done

          if [ "${attempt}" -gt 0 ]; then
            echo "Provisioning verified after ${attempt} restart(s)."
          else
            echo "Provisioning verified."
          fi

      - name: Provision test users
        run: bash dpdp-integration-test-suite/scripts/provision-test-users.sh

      # tests/08-event-notifications' real webhook-delivery tests run via WEBHOOK_RECEIVER_HOST -
      # no secret needed, see "Enable private-network webhook callbacks..." above.
      # npm ci and the browser install are already done, so run-e2e.sh skips both and
      # just execs playwright. The github reporter adds inline annotations; the config
      # itself only declares html.
      - name: Run Playwright
        working-directory: dpdp-integration-test-suite
        run: ./run-e2e.sh --reporter=github,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            dpdp-integration-test-suite/playwright-report/
            dpdp-integration-test-suite/test-results/
          retention-days: 7

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carbon-logs
          path: ${{ env.IS_HOME }}/repository/logs/
          retention-days: 7

      - name: Stop the Identity Server
        if: always()
        run: |
          "${IS_HOME}/bin/wso2server.sh" stop || true

# The required-check side of this lives in pr-e2e-gate.yml and pr-e2e.yml, which
# publish the result as the overwritable "E2E (label-gated)" commit status rather than as a
# check run per workflow run.
