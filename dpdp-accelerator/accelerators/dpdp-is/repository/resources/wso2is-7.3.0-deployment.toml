# Backs the complaint management API's jdbc/ComplaintDB datasource (see DBUtil#getConnection()
# in the complaint DAO module). MySQL only for now - point the url at an already-created, empty
# database; the schema is created automatically on first startup. bin/configure.sh substitutes
# these CO_DB_* tokens from configure.properties; edit that file, not this one, to change the
