# =============================================================================
# WSO2 DPDP Accelerator
#
# Everything above this banner is the stock WSO2 Identity Server 7.3.0
# deployment.toml, unchanged apart from the IS_HOSTNAME, IS_ADMIN_USERNAME and
# IS_ADMIN_PASSWORD placeholders that configure.sh substitutes.
# =============================================================================

# Enables the consent management v2 API used by the consent portal. This single
# switch also re-renders repository/conf/identity/resource-access-control-v2.xml
# with the v2 rules and registers the v2 API resources together with their
# internal_consent_mgt_* scopes, so none of those files should be edited by hand.
[consent_mgt]
enable_v2_api = true

# Lets the Console's flows view read consent purposes.
[console.flows.scopes]
read = ["internal_flow_view", "internal_governance_view", "internal_consent_mgt_purpose_view"]

# The consent portal's BFF authenticates every request itself: it rejoins the
# split access-token cookie halves and forwards the user's own token to the
# Identity Server APIs, which then enforce that user's scopes. The server's
# authentication valve must therefore not gate these paths. Webapp contexts that
# are not listed here default to secured, which would reject the SPA's static
# assets and the login and callback redirects before any servlet ran. The
# pattern has no slash before the wildcard so the bare context path matches too.
#
# Entries here are merged with the Identity Server's built-in rules rather than
# replacing them.
[[resource.access_control]]
context = "(.*)/consent-portal(.*)"
secure = "false"
http_method = "all"

# Optional overrides for the complaint management API's tunable policies, read by
# AppBootstrap#loadDeploymentConfig at webapp startup. Both sections - and every key in
# them - are optional; the values below match the built-in defaults used when this
# deployment.toml has no [attachment]/[statutory] table at all (AttachmentPolicy /
# StatutoryDuePeriodPolicy in the service module), so leaving them as-is changes nothing.
[attachment]
# Maximum size, in bytes, of a single complaint/comment attachment upload.
maxSizeBytes = 10485760

[statutory]
# Days from complaint creation until STATUTORY_DUE_TIME, per the DPDP Act's grievance
# redressal timeline.
dueDatePeriodDays = 90

# The category-to-priority mapping GET /complaints/categories reports and
# ComplaintServiceImpl derives each new complaint's priority from. Optional - overrides
# the built-in defaults in PriorityMapper wholesale (not merged); every category must be
# listed if this table is present at all, or the omitted ones lose their priority.
#[categoryPriority]
#DATA_BREACH = "CRITICAL"
#UNAUTHORIZED_DATA_SHARING = "HIGH"
#CONSENT_WITHDRAWN_DATA_STILL_USED = "HIGH"
#PURPOSE_VIOLATION = "HIGH"
#DATA_ACCESS_DENIED = "HIGH"
#DATA_ERASURE_NOT_COMPLETED = "MEDIUM"
#DATA_CORRECTION_NOT_COMPLETED = "MEDIUM"
#CONSENT_LIFECYCLE_ISSUE = "MEDIUM"
#EXCESSIVE_DATA_COLLECTION = "MEDIUM"
#OTHER = "LOW"

# The complaint management API has no application-level authentication of its own -
# the org-id header identifies which organization's data to act on, not who the
# caller is - so the server's own authentication valve is the only thing standing
# between this API and an unauthenticated caller. Scopes follow the same
# portal_complaint_{read,write}_{self,any} vocabulary the portal BFF already uses:
# a token with either the self or the any variant of the right read/write scope is
# accepted, since self-vs-any ownership filtering happens in the application layer,
# not here - except complaint creation, which is self-only (there is no "create a
# complaint on someone else's behalf" capability, so there is no _any variant of it).
#
# /complaints/categories and /complaints/{complaintId} are the same shape as a raw
# path (/complaints/<one-segment>); the get-by-id pattern excludes the literal
# "categories" via a negative lookahead so the two can't ambiguously both match,
# rather than relying on rule-evaluation order between these entries.
[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints"
http_method = "POST"
secure = "true"
scopes = ["portal_complaint_write_self"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints"
http_method = "GET"
secure = "true"
scopes = ["portal_complaint_read_self", "portal_complaint_read_any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints/categories"
http_method = "GET"
secure = "true"
scopes = ["portal_complaint_read_self", "portal_complaint_read_any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints/(?!categories)[^/]+"
http_method = "GET"
secure = "true"
scopes = ["portal_complaint_read_self", "portal_complaint_read_any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints/[^/]+/status"
http_method = "POST"
secure = "true"
scopes = ["portal_complaint_write_self", "portal_complaint_write_any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints/[^/]+/timeline"
http_method = "GET"
secure = "true"
scopes = ["portal_complaint_read_self", "portal_complaint_read_any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints/[^/]+/comments"
http_method = "POST"
secure = "true"
scopes = ["portal_complaint_write_self", "portal_complaint_write_any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints/[^/]+/attachments"
http_method = "POST"
secure = "true"
scopes = ["portal_complaint_write_self", "portal_complaint_write_any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints/[^/]+/attachments/[^/]+"
http_method = "GET"
secure = "true"
scopes = ["portal_complaint_read_self", "portal_complaint_read_any"]

[[resource.access_control]]
context = "(.*)/api/dpdp/complaints/v1/complaints/[^/]+/comments/[^/]+/attachments"
http_method = "POST"
secure = "true"
scopes = ["portal_complaint_write_self", "portal_complaint_write_any"]
