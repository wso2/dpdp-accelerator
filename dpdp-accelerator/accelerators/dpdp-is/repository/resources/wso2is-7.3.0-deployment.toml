# Controls the DPDP Consent Portal application/role auto-provisioning that runs
# on tenant creation and update (see components/org.wso2.dpdp.accelerator.identity.extensions).
# Set auto_provisioning_enabled = false to manage the application and roles by
# hand instead - this does not disable the portal itself, only the automatic
# creation of its application and roles.
# client_id must match whatever the deployed portal's own configuration expects -
# changing it here without updating that too will break sign-in.
[dpdp_accelerator.consent_portal]
auto_provisioning_enabled = true
client_id = "DPDP_CONSENT_PORTAL"

# A machine-to-machine (client_credentials) OAuth2 application, provisioned per tenant alongside
# the portal, authorized for every consent-mgt v2 API resource (consents/purposes/elements) with
# all of their scopes - for external systems that need to invoke those APIs directly rather than
# through the portal's own narrower scope set. Independently toggleable from the portal.
[dpdp_accelerator.consent_api_invoker]
auto_provisioning_enabled = true
client_id = "DPDP_CONSENT_API_INVOKER"

# How many days after submission a complaint's statutory due date falls (see
# StatutoryDuePeriodPolicy) - the deadline ComplaintSlaIndicator warns against in the portal.
[dpdp_accelerator.complaints]
statutory_due_period_days = 90
# Maximum size, in bytes, of a single complaint attachment upload (see AttachmentPolicy).
attachment_max_size_bytes = 10485760
# Maximum number of files a single complaint attachment upload request may carry (see AttachmentPolicy).
attachment_max_files_per_upload = 5

# Event Notification Framework runtime settings.
[dpdp_accelerator.event_notifications]
# Automatically reconciles the DPDP system topics (consent.update, consent.revoke, etc.) for
# every tenant on create/update. Set false to manage system topics manually instead.
system_topics_auto_create_enabled = true

[dpdp_accelerator.event_notifications.payload_signing]
enabled = true
audience = "dpdp-event-notifications"

[dpdp_accelerator.event_notifications.lifecycle_events]
#Controls whether consent and user lifecycle events are automatically published to the Event Notification
# Framework for the five predefined topics.
publishing_enabled = true

[dpdp_accelerator.event_notifications.polling]
default_return_immediately = true
default_max_events = 20
max_events_limit = 100
request_hmac_validation_enabled = false

# Webhook delivery: callback URL validation, delivery worker sizing, retry/backoff, and
# subscription-verification behavior.
[dpdp_accelerator.event_notifications.webhook]
thread_pool_size = 4
base_backoff_seconds = 5
# Number of retries after the initial webhook delivery or subscription-verification attempt.
# For example, 5 allows up to 6 total attempts.
max_retries = 5
allow_http_callback_url = true
# Comma-separated destination ports permitted for webhook callback URLs (-1 means no port was
# specified in the URL). Widen this only to admit a subscriber's genuine non-standard port.
allowed_callback_ports = "-1,80,443,8443"
# Set true only for controlled/on-prem deployments where a webhook receiver legitimately lives
# on a private/internal network (RFC1918, link-local, IPv6 unique-local). Loopback, wildcard,
# and multicast targets are always rejected regardless of this setting.
allow_private_network_callback_targets = false
delivery_worker_batch_size = 50
delivery_worker_poll_seconds = 5
stuck_inflight_threshold_seconds = 10
max_verification_response_body_bytes = 4096
pending_subscription_recovery_threshold_seconds = 60
background_worker_initial_delay_seconds = 10
pending_subscription_recovery_interval_seconds = 30
pending_subscription_recovery_batch_size = 20
worker_shutdown_timeout_seconds = 5

# Controls the capture (identity.extensions) and read APIs (consent.mgt.extensions.endpoint)
# for consent status-audit/history. Set enabled = false to turn off both capture
# and the read APIs; snapshot_enabled = false keeps the lightweight status-audit
# trail but stops storing full pre-mutation JSON snapshots. Both features share the
# accelerator's central datasource - see [datasource.WSO2DPDP_DB] above.
[dpdp_accelerator.consent_history]
enabled = true
snapshot_enabled = true

# Periodically records an EXPIRE history row for consents whose expiry time has passed -
# audit only, this never changes a consent's live status (the Identity Server already
# reports EXPIRED on read once expiryTime passes; this only fills in the missing history
# record for when that happened). cron_value is a standard Quartz cron expression; the
# default runs once daily at midnight. In a clustered deployment, see the "Clustering
# requirements" section of docs/configuration-guide.md before relying on this in production.
[dpdp_accelerator.consent_expiry]
enabled = true
cron_value = "0 0 0 * * ?"
batch_size = 100
