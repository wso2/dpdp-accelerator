#
# Per-database-type facts consumed by bin/configure.sh. Keys are prefixed with the
# uppercased DB_TYPE from configure.properties, which selects one set at run time.
#
# Supporting a new database type means adding a block here plus a <type>.sql in each
# dbscripts/dpdp-accelerator/<feature>/ directory - configure.sh needs no edit.
#
# Keys per type:
#   PORT              default port, overridden by DB_PORT in configure.properties
#   DRIVER            JDBC driver class, substituted into deployment.toml
#   URL_TEMPLATE      JDBC URL, substituted into deployment.toml ({host}/{port}/{db})
#   SCRIPT_SUFFIX     picks <suffix>.sql out of each dbscripts directory
#   DRIVER_URL        pinned driver jar, downloaded into repository/components/lib
#   CLIENT            command-line client used to run the schema scripts
#   CLIENT_ARGS       connection flags for that client
#   CLIENT_QUERY_ARGS extra flags that make it print bare, unformatted rows
#   PW_ENV            environment variable the client reads the password from, so it
#                     never appears in the process list
#   ADMIN_DB          server-level database to connect to for CREATE/DROP DATABASE
#   DB_EXISTS_SQL     prints one row if the database exists, nothing if it does not
#   CREATE_DB_SQL / DROP_DB_SQL
#
# Placeholders expanded in templates: {host} {port} {db} {user}

# --------------------------------------------------------------------------- h2
# Embedded, the default. The server owns the files under repository/database, so
# there is no host, port, driver download, or CREATE DATABASE step.
H2_PORT=
H2_DRIVER=org.h2.Driver
H2_URL_TEMPLATE="jdbc:h2:./repository/database/{db};DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=60000"
H2_SCRIPT_SUFFIX=h2
H2_DRIVER_URL=
H2_CLIENT=

# ------------------------------------------------------------------------ mysql
# The URL separator is the XML entity &amp;, not a bare &: the Identity Server renders
# this URL into master-datasources.xml, where a bare & aborts XML parsing and every
# datasource then fails to bind. This is why the FS accelerator writes it the same way.
MYSQL_PORT=3306
MYSQL_DRIVER=com.mysql.cj.jdbc.Driver
MYSQL_URL_TEMPLATE="jdbc:mysql://{host}:{port}/{db}?autoReconnect=true&amp;useSSL=false"
MYSQL_SCRIPT_SUFFIX=mysql
MYSQL_DRIVER_URL=https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/9.2.0/mysql-connector-j-9.2.0.jar
MYSQL_CLIENT=mysql
MYSQL_CLIENT_ARGS="-h{host} -P{port} -u{user} -D{db}"
MYSQL_CLIENT_QUERY_ARGS="-N -B"
MYSQL_PW_ENV=MYSQL_PWD
MYSQL_ADMIN_DB=mysql
MYSQL_DB_EXISTS_SQL="SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME = '{db}';"
MYSQL_CREATE_DB_SQL="CREATE DATABASE IF NOT EXISTS {db} CHARACTER SET {charset};"
MYSQL_DROP_DB_SQL="DROP DATABASE IF EXISTS {db};"
# The Identity Server's own DDL hardcodes CHARACTER SET latin1 on ~150 tables and
# builds foreign keys across the boundary with charset-less tables, so its databases
# must default to latin1 or MySQL 8 rejects the keys (error 3780). WSO2DPDP_DB is
# ours: its tables carry the portal's 22-language data, so it is utf8mb4 to match how
# H2 stores that text - the charset-less consent-history tables inherit this default.
# That inheritance is the reason WSO2DPDP_DB cannot also be latin1 today. Once
# wso2/dpdp-accelerator#170 makes the consent-history tables explicitly utf8mb4 (as
# complaint and event-notification already are), this split can go and all four
# databases can be created latin1 uniformly - drop MYSQL_DPDP_CHARSET then.
MYSQL_IS_CHARSET=latin1
MYSQL_DPDP_CHARSET=utf8mb4
