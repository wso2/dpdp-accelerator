#
# Deployment settings consumed by bin/configure.sh and bin/register-portal-app.sh.

# Hostname and port clients use to reach the Identity Server.
IS_HOSTNAME=localhost
IS_PORT=9443

# Identity Server administrator. Substituted into the shipped deployment.toml
# and used to register the portal application. It is never stored in the
# portal's runtime configuration.
IS_ADMIN_USERNAME=admin
IS_ADMIN_PASSWORD=admin

# The deployment.toml configure.sh installs. It is a complete file that REPLACES
# the one in the product, not a fragment merged into it. To support a different
# Identity Server version, add a template beside this one and point this at it.
PRODUCT_CONF_PATH=repository/resources/wso2is-7.3.0-deployment.toml

# Database the Identity Server stores consent data in. One of:
# h2, mysql, postgresql, mssql, oracle, db2.
# The matching dbscripts/migrations/consent/<type>-migration.txt is applied.
DB_TYPE=h2

# Set to false to skip the consent schema migration (for example when it has
# already been applied, or the database is managed elsewhere).
APPLY_CONSENT_DB_MIGRATION=true

# Role granted the consent administration scopes. Users in this role can see
# the administration and catalog areas of the portal; everyone else gets only
# their own consents.
PORTAL_ADMIN_ROLE=dpdp-consent-admin

# The complaint management API's database connection is configured directly in
# deployment.toml's [datasource.ComplaintDB] block, not here - see the comment
# above that block in repository/resources/wso2is-7.3.0-deployment.toml.
