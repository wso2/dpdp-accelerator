# Sample Quartz configuration for running the DPDP consent expiry job across a cluster.
#
# By default (no quartz.properties present) the job runs correctly on a single server, using
# Quartz's own in-memory scheduler. In a cluster, that default is NOT safe as-is: every node
# would run its own independent copy of the job, firing it once per node instead of once for
# the whole cluster on each scheduled tick.
#
# To use this file: copy it, unedited, to <IS_HOME>/repository/conf/quartz.properties on every
# node in the cluster, then create Quartz's own clustering tables (QRTZ_*) once in the DPDP
# accelerator's WSO2DPDP_DB database, using the DDL scripts published by the Quartz project for
# version 2.3.x:
# https://github.com/quartz-scheduler/quartz/tree/quartz-2.3.x/quartz-core/src/main/resources/org/quartz/impl/jdbcjobstore
# (pick the script matching your database - h2, mysql, postgres, etc.)
#
# See "Configuring periodical consent expiration" in docs/content/configuration-guide.md for the full
# walkthrough.

org.quartz.threadPool.class = org.quartz.simpl.SimpleThreadPool
org.quartz.threadPool.threadCount = 5

# JDBCJobStore, backed by the same jdbc/WSO2DPDP_DB datasource this accelerator already uses -
# looked up by JNDI rather than a direct JDBC connection, so no extra connection-pooling jars
# (e.g. c3p0) are needed.
org.quartz.jobStore.class = org.quartz.impl.jdbcjobstore.JobStoreTX
org.quartz.jobStore.driverDelegateClass = org.quartz.impl.jdbcjobstore.StdJDBCDelegate
org.quartz.jobStore.dataSource = dpdpDS
org.quartz.dataSource.dpdpDS.jndiURL = jdbc/WSO2DPDP_DB

# Turn on clustering.
org.quartz.jobStore.isClustered = true

org.quartz.scheduler.instanceName = DPDPConsentExpiryScheduler
# AUTO lets Quartz generate a unique id per node automatically, so this file can be copied to
# every node unedited.
org.quartz.scheduler.instanceId = AUTO
