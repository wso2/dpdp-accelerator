components:
  securitySchemes:
    PortalOAuthDocumentation:
      type: oauth2
      x-documentation-only: true
      description: >-
        Documentation model for the OAuth2 scopes enforced by the BFF. The URLs
        are deployment-specific placeholders. Note that the Swagger UI cannot execute the
        actual split-token flow. The Authorization header contains only the
        JavaScript-readable first half of the access token, and the BFF combines
        it with AccessTokenPart2 before validation.
      flows:
        authorizationCode:
          authorizationUrl: https://idp.example.com/oauth2/authorize
          tokenUrl: https://idp.example.com/oauth2/token
          scopes:
            'portal:consents:read:self': Read the current user's consents.
            'portal:consents:write:self': Approve or revoke the current user's consents.
            'portal:consents:read:any': Read consents through passthrough APIs.
            'portal:consents:write:any': Modify consents through passthrough APIs.
            'portal:elements:read': Read consent elements.
            'portal:elements:write': Modify consent elements.
            'portal:purposes:read': Read consent purposes.
            'portal:purposes:write': Modify consent purposes.
            'portal:complaint:read:self': Read the current user's own complaints.
            'portal:complaint:write:self': Submit or reply to the current user's own complaints.
            'portal:complaint:read:any': Read complaints across all data principals.
            'portal:complaint:write:any': Manage complaints across all data principals.
    AccessTokenPart2:
      type: apiKey
      in: cookie
      name: portal-at-p2
      description: Configurable HttpOnly second-half access-token cookie.
  parameters:
    ConsentID: { in: path, name: consentId, required: true, schema: { type: string } }
    PurposeID: { in: path, name: purposeId, required: true, schema: { type: string } }
    ElementID: { in: path, name: elementId, required: true, schema: { type: string } }
    Version: { in: path, name: version, required: true, schema: { type: string, pattern: '^v[1-9][0-9]*$' } }
    ComplaintID: { in: path, name: complaintId, required: true, schema: { type: string } }
    CommentID: { in: path, name: commentId, required: true, schema: { type: string } }
    AttachmentID: { in: path, name: attachmentId, required: true, schema: { type: string } }
    PortalSurface:
      in: header
      name: X-Portal-Surface
      required: true
      description: >-
        Selects which of the caller's own already-verified scopes this
        request exercises — the Data Principal's own complaints (`self`) or
        the Complaint Officer's cross-complaint access (`management`). The
        BFF always independently verifies the caller actually holds the
        scope implied by whichever value is sent; this header is never
        trusted for authorization by itself.
      schema: { type: string, enum: [self, management] }
  schemas:
    CurrentUser:
      type: object
      required: [userId, organizationId, scopes]
      properties:
        userId: { type: string }
        organizationId: { type: string }
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - portal:consents:read:self
              - portal:consents:write:self
              - portal:consents:read:any
              - portal:consents:write:any
              - portal:elements:read
              - portal:elements:write
              - portal:purposes:read
              - portal:purposes:write
              - portal:complaint:read:self
              - portal:complaint:write:self
              - portal:complaint:read:any
              - portal:complaint:write:any
    LogoutResponse:
      type: object
      required: [logoutUrl]
      properties:
        logoutUrl: { type: string, format: uri }
    ConsentSearchResponse:
      type: object
      required: [data, metadata]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ConsentDetail' }
        metadata:
          type: object
          required: [total, offset, count, limit]
          properties:
            total: { type: integer }
            offset: { type: integer }
            count: { type: integer }
            limit: { type: integer }
    ConsentDetail:
      type: object
      required: [id, groupId, type, status, createdTime, updatedTime, purposes]
      properties:
        id: { type: string }
        groupId: { type: string }
        type: { type: string }
        status: { type: string }
        createdTime: { type: integer, format: int64 }
        updatedTime: { type: integer, format: int64 }
        expirationTime: { type: integer, format: int64 }
        frequency: { type: integer }
        recurringIndicator: { type: boolean }
        dataAccessValidityDuration: { type: integer, format: int64 }
        attributes:
          type: object
          additionalProperties: { type: string }
        authorizations:
          type: array
          items: { $ref: '#/components/schemas/ConsentAuthorization' }
        purposes:
          type: array
          items: { $ref: '#/components/schemas/ConsentPurpose' }
        statusHistory:
          type: array
          items: { $ref: '#/components/schemas/ConsentStatusAuditItem' }
    ConsentStatusAuditItem:
      type: object
      required: [statusAuditId, currentStatus, actionTime]
      properties:
        statusAuditId: { type: string }
        previousStatus: { type: string }
        currentStatus: { type: string }
        actionTime: { type: integer, format: int64 }
        actionBy: { type: string, nullable: true }
        reason: { type: string, nullable: true }
    ConsentPurpose:
      type: object
      required: [purposeId, name, version, elements]
      properties:
        purposeId: { type: string }
        name: { type: string }
        version: { type: string }
        displayName: { type: string }
        description: { type: string }
        elements:
          type: array
          items: { $ref: '#/components/schemas/ConsentElement' }
    ConsentElement:
      type: object
      required: [elementId, name, namespace, version, approved, mandatory]
      properties:
        elementId: { type: string }
        name: { type: string }
        namespace: { type: string }
        version: { type: string }
        displayName: { type: string }
        approved: { type: boolean }
        mandatory: { type: boolean }
        description: { type: string }
        value: {}
    ConsentApprovalSelection:
      type: object
      required: [purposeId, purposeVersion, elementId, elementVersion]
      properties:
        purposeId: { type: string }
        purposeVersion: { type: string }
        elementId: { type: string }
        elementVersion: { type: string }
    ConsentAuthorization:
      type: object
      required: [id, type, status, updatedTime]
      properties:
        id: { type: string }
        userId: { type: string }
        type: { type: string }
        status: { type: string }
        updatedTime: { type: integer, format: int64 }
        resources: {}
    ProxyError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: UPSTREAM_UNAVAILABLE }
        message: { type: string, example: upstream unavailable }
    ComplaintCategory:
      type: string
      enum:
        - DATA_BREACH
        - UNAUTHORIZED_DATA_SHARING
        - CONSENT_WITHDRAWN_DATA_STILL_USED
        - PURPOSE_VIOLATION
        - DATA_ERASURE_NOT_COMPLETED
        - DATA_CORRECTION_NOT_COMPLETED
        - CONSENT_LIFECYCLE_ISSUE
        - DATA_ACCESS_DENIED
        - EXCESSIVE_DATA_COLLECTION
        - OTHER
    ComplaintPriority:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]
    ComplaintStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, WAITING_ON_CLIENT, AWAITING_INTERNAL_REVIEW, RESOLVED]
    ComplaintActorRole:
      type: string
      enum: [USER, COMPLAINT_OFFICER, SYSTEM]
    ComplaintAttachment:
      type: object
      required: [attachmentId, fileName, sizeBytes]
      properties:
        attachmentId: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
    ComplaintAttachmentDownload:
      type: object
      required: [contentType, content]
      properties:
        contentType: { type: string }
        content: { type: string, format: byte, description: Base64-encoded file content. }
    ComplaintRecord:
      type: object
      description: >-
        Matches complaint-server's ComplaintRecord, with a `referenceId`
        field added by the BFF (equal to `id` — complaint-server has no
        reference-number concept of its own).
      required:
        - id
        - referenceId
        - userId
        - subjectCategory
        - priority
        - status
        - description
        - submittedAt
        - updatedAt
        - statutoryDueDate
        - attachments
      properties:
        id: { type: string, format: uuid }
        referenceId: { type: string }
        userId: { type: string }
        subjectCategory: { $ref: '#/components/schemas/ComplaintCategory' }
        priority: { $ref: '#/components/schemas/ComplaintPriority' }
        status: { $ref: '#/components/schemas/ComplaintStatus' }
        description: { type: string }
        submittedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        statutoryDueDate: { type: string, format: date-time }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/ComplaintAttachment' }
    ComplaintListResponse:
      type: object
      required: [data, metadata]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ComplaintRecord' }
        metadata:
          type: object
          required: [total]
          properties:
            total: { type: integer }
    ComplaintCategoriesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ComplaintCategory' }
    ComplaintCreateRequest:
      type: object
      required: [subjectCategory, description]
      properties:
        subjectCategory: { $ref: '#/components/schemas/ComplaintCategory' }
        description: { type: string, maxLength: 5000 }
    ComplaintCreateResponse:
      type: object
      description: >-
        Trimmed from complaint-server's full ComplaintCreateResponse; the
        rest of the created record is available via GET /complaints/{id}.
      required: [id, referenceId]
      properties:
        id: { type: string, format: uuid }
        referenceId: { type: string }
    ComplaintTimelineEntry:
      type: object
      required: [id, type, isPublic, actorRole, message, attachments, createdTime]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [STATUS_CHANGE, COMMENT, INTERNAL_NOTE] }
        isPublic: { type: boolean }
        actorUserId: { type: string, nullable: true }
        actorRole: { $ref: '#/components/schemas/ComplaintActorRole' }
        message: { type: string }
        fromStatus: { allOf: [{ $ref: '#/components/schemas/ComplaintStatus' }], nullable: true }
        toStatus: { allOf: [{ $ref: '#/components/schemas/ComplaintStatus' }], nullable: true }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/ComplaintAttachment' }
        createdTime: { type: string, format: date-time }
    ComplaintTimelineListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ComplaintTimelineEntry' }
    ComplaintMessageRequest:
      type: object
      required: [message]
      properties:
        message: { type: string }
        isPublic:
          type: boolean
          description: >-
            Ignored (forced true) under the self surface. Under management,
            defaults to true if omitted; only a Complaint Officer may set it
            false, to post an officer-internal note.
        toStatus:
          allOf: [{ $ref: '#/components/schemas/ComplaintStatus' }]
          nullable: true
          description: Optional — transitions the complaint in the same call as posting this message.
    ComplaintCommentCreateResponse:
      type: object
      description: Trimmed from complaint-server's full comment response.
      required: [id]
      properties:
        id: { type: string, format: uuid }
    ComplaintStatusUpdateRequest:
      type: object
      required: [toStatus, note]
      properties:
        toStatus: { $ref: '#/components/schemas/ComplaintStatus' }
        note: { type: string }
    ComplaintStatusUpdateResponse:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ComplaintStatus' }
  responses:
    AuthError:
      description: Authentication request rejected.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProxyError' }
    ProxyError:
      description: BFF or upstream proxy error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProxyError' }
