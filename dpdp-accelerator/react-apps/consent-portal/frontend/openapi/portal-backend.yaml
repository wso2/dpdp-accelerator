      parameters:
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200': { description: Upstream response }
    post:
      tags: [Passthrough]
      summary: Create consent authorization
      security:
        - PortalOAuthDocumentation: [portal:consents:write:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200': { description: Upstream response }
  /api/consents/{consentId}/authorizations/{authorizationId}:
