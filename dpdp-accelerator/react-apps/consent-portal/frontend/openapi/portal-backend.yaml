openapi: 3.0.3
info:
  title: OpenFGC Portal Backend API
  version: 0.3.0
  description: >-
    Stateless portal backend endpoints, including health checks, portal-facing
    user routes, explicit passthrough routes to Consent Management API v0.3.0,
    and the /complaints route group proxied to the standalone complaint-server
    API v2.3.0. For proxied endpoints in this spec, response payload shape is
    inherited from the upstream API, except where noted (complaint-server has
    no `referenceId` concept, and its create/comment/status responses are
    trimmed to the leaner shapes documented below).
servers:
  - url: http://localhost:8080
security:
  - PortalOAuthDocumentation: []
    AccessTokenPart2: []
tags:
  - name: Health
  - name: Authentication
  - name: User
  - name: Complaints
  - name: Passthrough
paths:
  /health:
    get:
      tags: [Health]
      summary: Service health
      security: []
      responses:
        '200': { description: Service healthy }
  /health/liveness:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        '200': { description: Service live }
  /health/readiness:
    get:
      tags: [Health]
      summary: Readiness check
      security: []
      responses:
        '200': { description: Service ready }

  /auth/login:
    get:
      tags: [Authentication]
      summary: Start OIDC login
      description: >-
        Creates a short-lived, one-time login transaction in secure HttpOnly
        cookies and redirects with OAuth state and an S256 PKCE challenge.
      security: []
      responses:
        '302':
          description: Redirect to the configured identity provider.
  /auth/callback:
    get:
      tags: [Authentication]
      summary: Complete OIDC authorization-code login
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          description: Must match the one-time state cookie issued by `/auth/login`.
          schema: { type: string }
      responses:
        '302':
          description: >-
            Consumes the login transaction, exchanges the code with its PKCE
            verifier, and redirects to the portal after success or with a generic
            authentication error.
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh the split-token session
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: JavaScript-readable first half of the refresh token.
      responses:
        '204': { description: Token cookies replaced successfully. }
        '400': { $ref: '#/components/responses/AuthError' }
        '401': { $ref: '#/components/responses/AuthError' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Clear the local session and obtain the logout URL
      security:
        - PortalOAuthDocumentation: []
          AccessTokenPart2: []
      responses:
        '200':
          description: Local cookies cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResponse' }
        '401': { $ref: '#/components/responses/AuthError' }

  /me:
    get:
      tags: [User]
      summary: Get the authenticated portal user
      description: >-
        Returns identity and canonical portal authorization scopes derived from
        the locally validated access token. OIDC-only scopes are omitted.
      security:
        - PortalOAuthDocumentation: []
          AccessTokenPart2: []
      responses:
        '200':
          description: Authenticated portal user.
          headers:
            Cache-Control:
              description: Prevents authenticated user data from being cached.
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/AuthError' }

  /me/consents:
    get:
      tags: [User]
      summary: List current-user consents
      security:
        - PortalOAuthDocumentation: [portal:consents:read:self]
          AccessTokenPart2: []
      description: >-
        Proxies to `GET /api/v1/consents`, preserving supported search filters
        while replacing any browser-supplied `userIds` with the trusted current
        user and forcing `details=true` so purpose and element display details
        are included.
      parameters:
        - in: query
          name: consentStatuses
          description: Comma-separated consent statuses.
          schema: { type: string }
        - in: query
          name: consentTypes
          description: Comma-separated consent types.
          schema: { type: string }
        - in: query
          name: purposeName
          description: Purpose name contained by the consent.
          schema: { type: string }
        - in: query
          name: groupIds
          description: Comma-separated group IDs.
          schema: { type: string }
        - in: query
          name: elementName
          description: Element name contained by the consent.
          schema: { type: string }
        - in: query
          name: elementVersion
          description: >-
            Element version contained by the consent. Requires elementName.
          schema: { type: string }
        - in: query
          name: sort
          description: >-
            Up to three comma-separated sort items in `{field}:{direction}` or
            `{field}` form. Supported fields are `createdTime`, `updatedTime`,
            `validityTime`, `status`, `groupId`, and `consentType`; directions
            are `asc` and `desc`, with `desc` used when omitted. Defaults to
            `createdTime:desc` when the parameter is omitted.
          schema: { type: string }
        - in: query
          name: fromTime
          description: Inclusive lower bound for updated time, in Unix milliseconds.
          schema: { type: integer, format: int64 }
        - in: query
          name: toTime
          description: Inclusive upper bound for updated time, in Unix milliseconds.
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          description: Maximum number of consents to return.
          schema: { type: integer }
        - in: query
          name: offset
          description: Zero-based result offset.
          schema: { type: integer }
      responses:
        '200':
          description: Consent search response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentSearchResponse' }
        '502': { $ref: '#/components/responses/ProxyError' }
        '503': { $ref: '#/components/responses/ProxyError' }
  /me/consents/{consentId}:
    get:
      tags: [User]
      summary: Get current-user consent details
      security:
        - PortalOAuthDocumentation: [portal:consents:read:self]
          AccessTokenPart2: []
      description: >-
        Fetches one consent with `details=true` and returns its embedded purpose
        and element display names and descriptions unchanged. Status audit
        history is included by forcing `includeStatusHistory=true` upstream.
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200':
          description: Detailed consent snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentDetail' }
        '400': { $ref: '#/components/responses/ProxyError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
        '503': { $ref: '#/components/responses/ProxyError' }
  /me/consents/{consentId}/approve:
    post:
      tags: [User]
      summary: Approve selected optional elements
      security:
        - PortalOAuthDocumentation: [portal:consents:write:self]
          AccessTokenPart2: []
      description: >-
        Fetches the current consent with `details=true`, validates selected
        optional elements against its embedded IDs and versions, and builds a
        full `PUT /api/v1/consents/{consentId}` update. Mandatory and selected
        elements are approved, existing approvals and consent fields are
        preserved, and the trusted user's authorization is set to `APPROVED`.
        The consent's immutable `groupId` is sent as the trusted upstream
        `group-id` header, and the update response is returned unchanged.
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      requestBody:
        required: false
        description: |
          Optional elements to approve. An omitted or empty array still causes
          mandatory elements to be approved and updates the trusted user's
          authorization.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/ConsentApprovalSelection' }
      responses:
        '200':
          description: Consent server update response, returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentDetail' }
        '400': { $ref: '#/components/responses/ProxyError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '413': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
        '503': { $ref: '#/components/responses/ProxyError' }
  /me/consents/{consentId}/reject:
    post:
      tags: [User]
      summary: Reject a pending current-user consent
      security:
        - PortalOAuthDocumentation: [portal:consents:write:self]
          AccessTokenPart2: []
      description: >-
        Fetches the current consent with `details=true`, verifies ownership and
        that its status is `CREATED`, then builds a minimal
        `PUT /api/v1/consents/{consentId}` update. Existing authorizations are
        preserved and the trusted user's authorization status is changed to
        `REJECTED`. Purpose and element approvals are not included in the
        update. The consent's immutable `groupId` is sent as the trusted
        upstream `group-id` header.
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      requestBody:
        required: false
        description: No request properties are currently supported.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Consent server update response, returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentDetail' }
        '400': { $ref: '#/components/responses/ProxyError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '409': { $ref: '#/components/responses/ProxyError' }
        '413': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
        '503': { $ref: '#/components/responses/ProxyError' }
  /me/consents/{consentId}/revoke:
    post:
      tags: [User]
      summary: Revoke current-user consent
      security:
        - PortalOAuthDocumentation: [portal:consents:write:self]
          AccessTokenPart2: []
      description: >-
        Injects the trusted current user as `actionBy`, preserves an optional
        `revocationReason`, and forwards the request to
        `POST /api/v1/consents/{consentId}/revoke`. The upstream response is
        returned unchanged.
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      requestBody:
        required: false
        description: Optional revocation details. `actionBy` is controlled by the BFF.
        content:
          application/json:
            schema:
              type: object
              properties:
                revocationReason: { type: string }
      responses:
        '200':
          description: Consent server revocation response, returned unchanged.
          content:
            application/json:
              schema:
                type: object
        '400': { $ref: '#/components/responses/ProxyError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '413': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
        '503': { $ref: '#/components/responses/ProxyError' }

  /complaints:
    get:
      tags: [Complaints]
      summary: List complaints
      description: >-
        Proxies to complaint-server's `GET /complaints`. Under the `self`
        surface, any client-supplied `userId` filter is discarded and replaced
        with the caller's own verified id, so a Data Principal can only ever
        list their own complaints. Each record's `referenceId` is passed
        through unchanged from complaint-server.
      security:
        - PortalOAuthDocumentation: [portal:complaint:read:self, portal:complaint:read:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/PortalSurface'
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/ComplaintStatus' }
        - in: query
          name: priority
          schema: { $ref: '#/components/schemas/ComplaintPriority' }
        - in: query
          name: limit
          schema: { type: integer, default: 10, maximum: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
        - in: query
          name: sort
          schema: { type: string, default: '-updatedTime' }
      responses:
        '200':
          description: List of complaints
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplaintListResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '502': { $ref: '#/components/responses/ProxyError' }
    post:
      tags: [Complaints]
      summary: Create a complaint
      description: >-
        Injects the caller's own verified id as `userId` (a client-supplied
        value would let one user file a complaint in another's name), then
        proxies to complaint-server's `POST /complaints`. The response is
        trimmed to `{id, referenceId}`, both passed through unchanged from
        complaint-server.
      security:
        - PortalOAuthDocumentation: [portal:complaint:write:self]
          AccessTokenPart2: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComplaintCreateRequest' }
      responses:
        '201':
          description: Complaint created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplaintCreateResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '422': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
  /complaints/categories:
    get:
      tags: [Complaints]
      summary: List accepted complaint categories
      description: >-
        Answered locally by the BFF — complaint-server defines no such
        endpoint. Mirrors the `ComplaintCategory` enum in its contract.
      security:
        - PortalOAuthDocumentation: [portal:complaint:read:self, portal:complaint:read:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/PortalSurface'
      responses:
        '200':
          description: Accepted categories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplaintCategoriesResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
  /complaints/{complaintId}:
    get:
      tags: [Complaints]
      summary: Get complaint
      description: >-
        Under the `self` surface, fetches the complaint and returns 404
        (rather than 403) when the caller does not own it, so a non-owner
        cannot learn the complaint exists.
      security:
        - PortalOAuthDocumentation: [portal:complaint:read:self, portal:complaint:read:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/PortalSurface'
        - $ref: '#/components/parameters/ComplaintID'
      responses:
        '200':
          description: Complaint detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplaintRecord' }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
  /complaints/{complaintId}/timeline:
    get:
      tags: [Complaints]
      summary: Get complaint timeline
      description: >-
        Ownership-checked as above under `self`, which also forces
        `isPublic=true` regardless of what the client requests — a Data
        Principal must never see officer-internal notes.
      security:
        - PortalOAuthDocumentation: [portal:complaint:read:self, portal:complaint:read:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/PortalSurface'
        - $ref: '#/components/parameters/ComplaintID'
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: isPublic
          description: Ignored (forced true) under the self surface.
          schema: { type: boolean }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: asc }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Timeline entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplaintTimelineListResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
  /complaints/{complaintId}/comments:
    post:
      tags: [Complaints]
      summary: Add a comment, optionally transitioning status
      description: >-
        Ownership-checked as above under `self`. `actorUserId` is always the
        caller's own verified id. Under `self`, `actorRole` is forced to
        `USER` and `isPublic` is forced `true` (only a Complaint Officer may
        post an officer-internal note); under `management`, `actorRole` is
        `COMPLAINT_OFFICER` and `isPublic` defaults to `true` if omitted. The
        response is trimmed to `{id}`.
      security:
        - PortalOAuthDocumentation: [portal:complaint:write:self, portal:complaint:write:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/PortalSurface'
        - $ref: '#/components/parameters/ComplaintID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComplaintMessageRequest' }
      responses:
        '200':
          description: Comment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplaintCommentCreateResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '409': { $ref: '#/components/responses/ProxyError' }
        '422': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
  /complaints/{complaintId}/attachments:
    post:
      tags: [Complaints]
      summary: Upload attachments on a complaint
      description: Ownership-checked as above under `self`. Response is relayed unchanged.
      security:
        - PortalOAuthDocumentation: [portal:complaint:write:self, portal:complaint:write:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/PortalSurface'
        - $ref: '#/components/parameters/ComplaintID'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Attachments stored.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ComplaintAttachment' }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '422': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
  /complaints/{complaintId}/comments/{commentId}/attachments:
    post:
      tags: [Complaints]
      summary: Upload attachments on a comment
      description: >-
        Ownership-checked as above under `self`. complaint-server requires an
        `actorUserId` form field matching the comment's own author; the SPA
        never sends one, so the BFF injects the caller's own verified id.
      security:
        - PortalOAuthDocumentation: [portal:complaint:write:self, portal:complaint:write:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/PortalSurface'
        - $ref: '#/components/parameters/ComplaintID'
        - $ref: '#/components/parameters/CommentID'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Attachments stored.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ComplaintAttachment' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '422': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
  /complaints/{complaintId}/attachments/{attachmentId}:
    get:
      tags: [Complaints]
      summary: Download an attachment
      description: Ownership-checked as above under `self`. Response is relayed unchanged.
      security:
        - PortalOAuthDocumentation: [portal:complaint:read:self, portal:complaint:read:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/PortalSurface'
        - $ref: '#/components/parameters/ComplaintID'
        - $ref: '#/components/parameters/AttachmentID'
      responses:
        '200':
          description: Attachment metadata and base64-encoded content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplaintAttachmentDownload' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
  /complaints/{complaintId}/status:
    post:
      tags: [Complaints]
      summary: Transition complaint status
      description: >-
        Management surface only — a `self` request is rejected with 403
        regardless of the caller's scopes, since status transitions are an
        officer-only action. `actorUserId`/`actorRole` are set from the
        caller's own verified identity (`COMPLAINT_OFFICER`). The response is
        trimmed to `{status}` (complaint-server's `toStatus` field).
      security:
        - PortalOAuthDocumentation: [portal:complaint:write:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/PortalSurface'
        - $ref: '#/components/parameters/ComplaintID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComplaintStatusUpdateRequest' }
      responses:
        '200':
          description: Status transition confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplaintStatusUpdateResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '409': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }

  /api/consents:
    get:
      tags: [Passthrough]
      summary: Search consents
      security:
        - PortalOAuthDocumentation: [portal:consents:read:any]
          AccessTokenPart2: []
      responses:
        '200': { description: Upstream response }
    post:
      tags: [Passthrough]
      summary: Create consent
      security:
        - PortalOAuthDocumentation: [portal:consents:write:any]
          AccessTokenPart2: []
      responses:
        '200': { description: Upstream response }
  /api/consents/attributes:
    get:
      tags: [Passthrough]
      summary: Search consent attributes
      security:
        - PortalOAuthDocumentation: [portal:consents:read:any]
          AccessTokenPart2: []
      responses:
        '200': { description: Upstream response }
  /api/consents/validate:
    post:
      tags: [Passthrough]
      summary: Validate consent
      security:
        - PortalOAuthDocumentation: [portal:consents:read:any]
          AccessTokenPart2: []
      responses:
        '200': { description: Upstream response }
  /api/consents/{consentId}:
    get:
      tags: [Passthrough]
      summary: Get consent
      security:
        - PortalOAuthDocumentation: [portal:consents:read:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200': { description: Upstream response }
    put:
      tags: [Passthrough]
      summary: Update consent
      security:
        - PortalOAuthDocumentation: [portal:consents:write:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200': { description: Upstream response }
  /api/consents/{consentId}/history:
    get:
      tags: [Passthrough]
      summary: Get consent history
      security:
        - PortalOAuthDocumentation: [portal:consents:read:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200': { description: Upstream response }
  /api/consents/{consentId}/revoke:
    post:
      tags: [Passthrough]
      summary: Revoke consent
      security:
        - PortalOAuthDocumentation: [portal:consents:write:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200': { description: Upstream response }
  /api/consents/{consentId}/authorizations:
    get:
      tags: [Passthrough]
