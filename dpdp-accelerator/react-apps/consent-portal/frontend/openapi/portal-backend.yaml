openapi: 3.0.3
info:
  title: OpenFGC Portal Backend API
  version: 0.3.0
  description: >-
    Stateless portal backend endpoints, including health checks, portal-facing
    user routes, and explicit passthrough routes to Consent Management API v0.3.0.
    For proxied endpoints in this spec, response payload shape is inherited from the
    consent-management API.
servers:
  - url: http://localhost:8080
security:
  - PortalOAuthDocumentation: []
    AccessTokenPart2: []
tags:
  - name: Health
  - name: Authentication
  - name: User
  - name: Acting
  - name: Directory
  - name: Passthrough
paths:
  /health:
    get:
      tags: [Health]
      summary: Service health
      security: []
      responses:
        '200': { description: Service healthy }
  /health/liveness:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        '200': { description: Service live }
  /health/readiness:
    get:
      tags: [Health]
      summary: Readiness check
      security: []
      responses:
        '200': { description: Service ready }

  /auth/login:
    get:
      tags: [Authentication]
      summary: Start OIDC login
      description: >-
        Creates a short-lived, one-time login transaction in secure HttpOnly
        cookies and redirects with OAuth state and an S256 PKCE challenge.
      security: []
      responses:
        '302':
          description: Redirect to the configured identity provider.
  /auth/callback:
    get:
      tags: [Authentication]
      summary: Complete OIDC authorization-code login
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          description: Must match the one-time state cookie issued by `/auth/login`.
          schema: { type: string }
      responses:
        '302':
          description: >-
            Consumes the login transaction, exchanges the code with its PKCE
            verifier, and redirects to the portal after success or with a generic
            authentication error.
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh the split-token session
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: JavaScript-readable first half of the refresh token.
      responses:
        '204': { description: Token cookies replaced successfully. }
        '400': { $ref: '#/components/responses/AuthError' }
        '401': { $ref: '#/components/responses/AuthError' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Clear the local session and obtain the logout URL
      security:
        - PortalOAuthDocumentation: []
          AccessTokenPart2: []
      responses:
        '200':
          description: Local cookies cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResponse' }
        '401': { $ref: '#/components/responses/AuthError' }

  /me:
    get:
      tags: [User]
      summary: Get the authenticated portal user
      description: >-
        Returns identity and canonical portal authorization scopes derived from
        the locally validated access token. OIDC-only scopes are omitted.
      security:
        - PortalOAuthDocumentation: []
          AccessTokenPart2: []
      responses:
        '200':
          description: Authenticated portal user.
          headers:
            Cache-Control:
              description: Prevents authenticated user data from being cached.
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/AuthError' }

  /me/consents:
    get:
      tags: [User]
      summary: List current-user consents
      security:
        - PortalOAuthDocumentation: [portal:consents:read:self]
          AccessTokenPart2: []
      description: >-
        Proxies to `GET /api/v1/consents`, preserving supported search filters
        while replacing any browser-supplied `userIds` with the trusted current
        user and forcing `details=true` so purpose and element display details
        are included.
      parameters:
        - in: query
          name: consentStatuses
          description: Comma-separated consent statuses.
          schema: { type: string }
        - in: query
          name: consentTypes
          description: Comma-separated consent types.
          schema: { type: string }
        - in: query
          name: purposeName
          description: Purpose name contained by the consent.
          schema: { type: string }
        - in: query
          name: groupIds
          description: Comma-separated group IDs.
          schema: { type: string }
        - in: query
          name: elementName
          description: Element name contained by the consent.
          schema: { type: string }
        - in: query
          name: elementVersion
          description: >-
            Element version contained by the consent. Requires elementName.
          schema: { type: string }
        - in: query
          name: sort
          description: >-
            Up to three comma-separated sort items in `{field}:{direction}` or
            `{field}` form. Supported fields are `createdTime`, `updatedTime`,
            `validityTime`, `status`, `groupId`, and `consentType`; directions
            are `asc` and `desc`, with `desc` used when omitted. Defaults to
            `createdTime:desc` when the parameter is omitted.
          schema: { type: string }
        - in: query
          name: fromTime
          description: Inclusive lower bound for updated time, in Unix milliseconds.
          schema: { type: integer, format: int64 }
        - in: query
          name: toTime
          description: Inclusive upper bound for updated time, in Unix milliseconds.
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          description: Maximum number of consents to return.
          schema: { type: integer }
        - in: query
          name: offset
          description: Zero-based result offset.
          schema: { type: integer }
      responses:
        '200':
          description: Consent search response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentSearchResponse' }
        '502': { $ref: '#/components/responses/ProxyError' }
        '503': { $ref: '#/components/responses/ProxyError' }
  /me/consents/{consentId}:
    get:
      tags: [User]
      summary: Get current-user consent details
      security:
        - PortalOAuthDocumentation: [portal:consents:read:self]
          AccessTokenPart2: []
      description: >-
        Fetches one consent with `details=true` and returns its embedded purpose
        and element display names and descriptions unchanged. Status audit
        history is included by forcing `includeStatusHistory=true` upstream.
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200':
          description: Detailed consent snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentDetail' }
        '400': { $ref: '#/components/responses/ProxyError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
        '503': { $ref: '#/components/responses/ProxyError' }
  /me/consents/{consentId}/approve:
    post:
      tags: [User]
      summary: Approve selected optional elements
      security:
        - PortalOAuthDocumentation: [portal:consents:approve:self]
          AccessTokenPart2: []
      description: >-
        Fetches the current consent with `details=true`, validates selected
        optional elements against its embedded IDs and versions, and builds a
        full `PUT /api/v1/consents/{consentId}` update. Mandatory and selected
        elements are approved, existing approvals and consent fields are
        preserved, and the trusted user's authorization is set to `APPROVED`.
        The consent's immutable `groupId` is sent as the trusted upstream
        `group-id` header, and the update response is returned unchanged.
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      requestBody:
        required: false
        description: |
          Optional elements to approve. An omitted or empty array still causes
          mandatory elements to be approved and updates the trusted user's
          authorization.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/ConsentApprovalSelection' }
      responses:
        '200':
          description: Consent server update response, returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentDetail' }
        '400': { $ref: '#/components/responses/ProxyError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '413': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
        '503': { $ref: '#/components/responses/ProxyError' }
  /me/consents/{consentId}/reject:
    post:
      tags: [User]
      summary: Reject a pending current-user consent
      security:
        - PortalOAuthDocumentation: [portal:consents:write:self]
          AccessTokenPart2: []
      description: >-
        Fetches the current consent with `details=true`, verifies ownership and
        that its status is `CREATED`, then builds a minimal
        `PUT /api/v1/consents/{consentId}` update. Existing authorizations are
        preserved and the trusted user's authorization status is changed to
        `REJECTED`. Purpose and element approvals are not included in the
        update. The consent's immutable `groupId` is sent as the trusted
        upstream `group-id` header.
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      requestBody:
        required: false
        description: No request properties are currently supported.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Consent server update response, returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentDetail' }
        '400': { $ref: '#/components/responses/ProxyError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '409': { $ref: '#/components/responses/ProxyError' }
        '413': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
        '503': { $ref: '#/components/responses/ProxyError' }
  /me/consents/{consentId}/revoke:
    post:
      tags: [User]
      summary: Revoke current-user consent
      security:
        - PortalOAuthDocumentation: [portal:consents:write:self]
          AccessTokenPart2: []
      description: >-
        Injects the trusted current user as `actionBy`, preserves an optional
        `revocationReason`, and forwards the request to
        `POST /api/v1/consents/{consentId}/revoke`. The upstream response is
        returned unchanged.
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      requestBody:
        required: false
        description: Optional revocation details. `actionBy` is controlled by the BFF.
        content:
          application/json:
            schema:
              type: object
              properties:
                revocationReason: { type: string }
      responses:
        '200':
          description: Consent server revocation response, returned unchanged.
          content:
            application/json:
              schema:
                type: object
        '400': { $ref: '#/components/responses/ProxyError' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '413': { $ref: '#/components/responses/ProxyError' }
        '502': { $ref: '#/components/responses/ProxyError' }
        '503': { $ref: '#/components/responses/ProxyError' }

  /acting/start:
    get:
      tags: [Acting]
      summary: Begin acting for another user
      description: >-
        The identity provider identifies the nominee from its own session rather than from a token this
        service could forward, so the request has to originate in the browser.
        Redirects to the identity provider, which returns a `subject_token` in the
        URL fragment. The fragment is readable only by the browser, which posts it
        back to `/acting/exchange`.
      security:
        - PortalOAuthDocumentation: []
          AccessTokenPart2: []
      parameters:
        - in: query
          name: ownerId
          required: true
          description: The account the caller wishes to act for.
          schema: { type: string, format: uuid }
      responses:
        '302':
          description: >-
            Redirect to the identity provider, with a one-time acting state
            cookie issued alongside it.
        '400': { $ref: '#/components/responses/ProxyError' }
        '401': { $ref: '#/components/responses/AuthError' }
  /acting/exchange:
    post:
      tags: [Acting]
      summary: Exchange the subject token for an acting session
      description: >-
        Performs the RFC 8693 token exchange server-side, pairing the subject
        token with the caller's own access token as `actor_token`. The identity
        provider compares that token's subject against the subject token's
        `may_act` claim, so possession of a leaked subject token is not by itself
        enough. On success the delegated token is stored in an HttpOnly cookie and
        is never returned to the browser.
      security:
        - PortalOAuthDocumentation: []
          AccessTokenPart2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectToken, state]
              properties:
                subjectToken:
                  type: string
                  description: Read from the fragment the identity provider redirected to.
                state:
                  type: string
                  description: Must match the one-time state cookie issued by `/acting/start`.
      responses:
        '200':
          description: Acting session established.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActingSession' }
        '400': { $ref: '#/components/responses/ProxyError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ActingForbidden' }
  /acting/stop:
    post:
      tags: [Acting]
      summary: End the acting session
      description: >-
        Clears the delegated token cookie. The cookie is browser-wide, so this
        ends acting in every tab rather than only the calling one.
      security:
        - ActingToken: []
      responses:
        '204': { description: Acting session ended. }

  /acting/consents:
    get:
      tags: [Acting]
      summary: List the owner's consents
      description: >-
        Requires `portal:consents:read:self` in the delegated token and a live
        `CONSENT_VIEW` grant. The owner is taken from the delegated token's
        subject; nothing the browser sends decides whose data is returned.
      security:
        - ActingToken: []
      parameters:
        - $ref: '#/components/parameters/ActingOwner'
        - in: query
          name: consentStatuses
          description: Comma-separated consent statuses.
          schema: { type: string }
        - in: query
          name: consentTypes
          description: Comma-separated consent types.
          schema: { type: string }
        - in: query
          name: fromTime
          description: Inclusive lower bound for updated time, in Unix milliseconds.
          schema: { type: integer, format: int64 }
        - in: query
          name: toTime
          description: Inclusive upper bound for updated time, in Unix milliseconds.
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          description: Maximum number of consents to return.
          schema: { type: integer }
        - in: query
          name: offset
          description: Zero-based result offset.
          schema: { type: integer }
      responses:
        '200':
          description: A page of the owner's consents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentSearchResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ActingForbidden' }
        '409': { $ref: '#/components/responses/ActingOwnerMismatch' }
        '502': { $ref: '#/components/responses/GateUnavailable' }
        '503': { $ref: '#/components/responses/ProxyError' }
  /acting/consents/{consentId}:
    get:
      tags: [Acting]
      summary: Read one of the owner's consents
      description: >-
        Requires `portal:consents:read:self` and a live `CONSENT_VIEW` grant.
      security:
        - ActingToken: []
      parameters:
        - $ref: '#/components/parameters/ActingOwner'
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200':
          description: Detailed consent snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentDetail' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ActingForbidden' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '409': { $ref: '#/components/responses/ActingOwnerMismatch' }
        '502': { $ref: '#/components/responses/GateUnavailable' }
  /acting/consents/{consentId}/revoke:
    post:
      tags: [Acting]
      summary: Revoke one of the owner's consents
      description: >-
        Requires `portal:consents:write:self` and a live `CONSENT_REVOKE` grant,
        so a view-only nominee is refused before the consent server is contacted.
        The consent's immutable `groupId` is sent as the trusted upstream
        `group-id` header. The audit trail records the nominee as the actor,
        never the owner.
      security:
        - ActingToken: []
      parameters:
        - $ref: '#/components/parameters/ActingOwner'
        - $ref: '#/components/parameters/ConsentID'
      requestBody:
        required: false
        description: Optional revocation details. `actionBy` is controlled by the BFF.
        content:
          application/json:
            schema:
              type: object
              properties:
                revocationReason: { type: string }
      responses:
        '200':
          description: Consent server revocation response, returned unchanged.
          content:
            application/json:
              schema:
                type: object
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ActingForbidden' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '409': { $ref: '#/components/responses/ActingOwnerMismatch' }
        '502': { $ref: '#/components/responses/GateUnavailable' }
  /acting/consents/{consentId}/approve:
    post:
      tags: [Acting]
      summary: Approve one of the owner's pending consents
      description: >-
        Requires `portal:consents:approve:self` and a live `CONSENT_APPROVE`
        grant, which is separate from `CONSENT_REVOKE` and not implied by it:
        revoking withdraws processing the owner already chose, while approving
        authorises new processing in their name. The approval is recorded against
        the owner, whose consent it is; who performed it is carried by the audit
        trail.
      security:
        - ActingToken: []
      parameters:
        - $ref: '#/components/parameters/ActingOwner'
        - $ref: '#/components/parameters/ConsentID'
      requestBody:
        required: false
        description: |
          Optional elements to approve. An omitted or empty array still causes
          mandatory elements to be approved and updates the owner's authorization.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/ConsentApprovalSelection' }
      responses:
        '200':
          description: Consent server update response, returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentDetail' }
        '400': { $ref: '#/components/responses/ProxyError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/ActingForbidden' }
        '404': { $ref: '#/components/responses/ProxyError' }
        '409': { $ref: '#/components/responses/ActingOwnerMismatch' }
        '502': { $ref: '#/components/responses/GateUnavailable' }

  /users/{id}:
    get:
      tags: [Directory]
      summary: Resolve a user ID to a display name
      description: >-
        Lets the portal show a readable identity wherever it holds only an ID,
        such as an owner or nominee returned by the nominee service, which has no
        directory access of its own.


        Either scope is sufficient, and neither implies the other: an ordinary
        user resolves the people they have nominated, while an administrator
        resolves anyone at all and holds only the `:any` scope.
      security:
        - PortalOAuthDocumentation: [portal:profile:read:self]
          AccessTokenPart2: []
        - PortalOAuthDocumentation: [portal:profile:read:any]
          AccessTokenPart2: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '400': { $ref: '#/components/responses/ProxyError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/ProxyError' }
  /nominees/lookup:
    get:
      tags: [Directory]
      summary: Find a nominee candidate by email
      description: >-
        Nominations are keyed on the user ID, but an owner knows their nominee by
        email address. This resolves one to the other. The match is exact; no
        partial or wildcard search is supported.
      security:
        - PortalOAuthDocumentation: [portal:profile:read:self]
          AccessTokenPart2: []
      parameters:
        - in: query
          name: email
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '400': { $ref: '#/components/responses/ProxyError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/ProxyError' }
  /admin/users/search:
    get:
      tags: [Directory]
      summary: Search users
      description: Administrative user search, used to attribute nominations to people.
      security:
        - PortalOAuthDocumentation: [portal:profile:read:any]
          AccessTokenPart2: []
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Matching users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserSummary' }
        '400': { $ref: '#/components/responses/ProxyError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }

  /api/consents:
    get:
      tags: [Passthrough]
      summary: Search consents
      security:
        - PortalOAuthDocumentation: [portal:consents:read:any]
          AccessTokenPart2: []
      responses:
        '200': { description: Upstream response }
    post:
      tags: [Passthrough]
      summary: Create consent
      security:
        - PortalOAuthDocumentation: [portal:consents:write:any]
          AccessTokenPart2: []
      responses:
        '200': { description: Upstream response }
  /api/consents/attributes:
    get:
      tags: [Passthrough]
      summary: Search consent attributes
      security:
        - PortalOAuthDocumentation: [portal:consents:read:any]
          AccessTokenPart2: []
      responses:
        '200': { description: Upstream response }
  /api/consents/validate:
    post:
      tags: [Passthrough]
      summary: Validate consent
      security:
        - PortalOAuthDocumentation: [portal:consents:read:any]
          AccessTokenPart2: []
      responses:
        '200': { description: Upstream response }
  /api/consents/{consentId}:
    get:
      tags: [Passthrough]
      summary: Get consent
      security:
        - PortalOAuthDocumentation: [portal:consents:read:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200': { description: Upstream response }
    put:
      tags: [Passthrough]
      summary: Update consent
      security:
        - PortalOAuthDocumentation: [portal:consents:write:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200': { description: Upstream response }
  /api/consents/{consentId}/history:
    get:
      tags: [Passthrough]
      summary: Get consent history
      security:
        - PortalOAuthDocumentation: [portal:consents:read:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200': { description: Upstream response }
  /api/consents/{consentId}/revoke:
    post:
      tags: [Passthrough]
      summary: Revoke consent
      security:
        - PortalOAuthDocumentation: [portal:consents:write:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200': { description: Upstream response }
  /api/consents/{consentId}/authorizations:
    get:
      tags: [Passthrough]
      summary: List consent authorizations
      security:
        - PortalOAuthDocumentation: [portal:consents:read:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200': { description: Upstream response }
    post:
      tags: [Passthrough]
      summary: Create consent authorization
      security:
        - PortalOAuthDocumentation: [portal:consents:write:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/ConsentID'
      responses:
        '200': { description: Upstream response }
  /api/consents/{consentId}/authorizations/{authorizationId}:
    get:
      tags: [Passthrough]
      summary: Get consent authorization
      security:
        - PortalOAuthDocumentation: [portal:consents:read:any]
          AccessTokenPart2: []
      parameters:
        - $ref: '#/components/parameters/ConsentID'
        - { in: path, name: authorizationId, required: true, schema: { type: string } }
      responses:
        '200': { description: Upstream response }
    put:
      tags: [Passthrough]
      summary: Update consent authorization
