components:
  securitySchemes:
    PortalOAuthDocumentation:
      type: oauth2
      x-documentation-only: true
      description: >-
        Documentation model for the OAuth2 scopes enforced by the BFF. The URLs
        are deployment-specific placeholders. Note that the Swagger UI cannot execute the
        actual split-token flow. The Authorization header contains only the
        JavaScript-readable first half of the access token, and the BFF combines
        it with AccessTokenPart2 before validation.
      flows:
        authorizationCode:
          authorizationUrl: https://idp.example.com/oauth2/authorize
          tokenUrl: https://idp.example.com/oauth2/token
          scopes:
            'portal:consents:read:self': Read the current user's consents.
            'portal:consents:write:self': Revoke the current user's consents.
            'portal:consents:approve:self': Approve the current user's pending consents. Separate from write because approving authorises new processing, while revoking withdraws processing already chosen.
            'portal:consents:read:any': Read consents through passthrough APIs.
            'portal:consents:write:any': Modify consents through passthrough APIs.
            'portal:elements:read': Read consent elements.
            'portal:elements:write': Modify consent elements.
            'portal:purposes:read': Read consent purposes.
            'portal:profile:read:self': Read the current user's profile.
            'portal:profile:write:self': Change the current user's profile.
            'portal:profile:delete:self': Close the current user's account.
            'portal:profile:read:any': Read any user's profile (administrative).
            'portal:profile:write:any': Change any user's profile (administrative).
            'portal:purposes:write': Modify consent purposes.
    AccessTokenPart2:
      type: apiKey
      in: cookie
      name: portal-at-p2
      description: Configurable HttpOnly second-half access-token cookie.
    ActingToken:
      type: apiKey
      in: cookie
      name: portal-acting-token
      description: >-
        Configurable HttpOnly cookie holding the delegated token obtained by
        `/acting/exchange`. It is not split, because it is never read by
        JavaScript, and it authenticates the acting routes in place of the
        caller's own access token. Its subject is the owner and its scopes were
        narrowed to the owner's grant when it was minted, so it cannot be used to
        widen access later.
  parameters:
    ConsentID: { in: path, name: consentId, required: true, schema: { type: string } }
    ActingOwner:
      in: header
      name: X-Acting-Owner
      required: true
      description: >-
        The owner the caller believes it is acting for. Compared against the
        delegated token's subject and rejected with `409` when they differ, so a
        tab whose acting session was replaced by another tab fails loudly instead
        of silently operating on the wrong account.
      schema: { type: string, format: uuid }
    PurposeID: { in: path, name: purposeId, required: true, schema: { type: string } }
    ElementID: { in: path, name: elementId, required: true, schema: { type: string } }
    Version: { in: path, name: version, required: true, schema: { type: string, pattern: '^v[1-9][0-9]*$' } }
  schemas:
    CurrentUser:
      type: object
      required: [userId, organizationId, scopes]
      properties:
        userId: { type: string }
        organizationId: { type: string }
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - portal:consents:read:self
              - portal:consents:write:self
              - portal:consents:read:any
              - portal:consents:write:any
              - portal:elements:read
              - portal:elements:write
              - portal:purposes:read
              - portal:purposes:write
    LogoutResponse:
      type: object
      required: [logoutUrl]
      properties:
        logoutUrl: { type: string, format: uri }
    ConsentSearchResponse:
      type: object
      required: [data, metadata]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ConsentDetail' }
        metadata:
          type: object
          required: [total, offset, count, limit]
          properties:
            total: { type: integer }
            offset: { type: integer }
            count: { type: integer }
            limit: { type: integer }
    ConsentDetail:
      type: object
      required: [id, groupId, type, status, createdTime, updatedTime, purposes]
      properties:
        id: { type: string }
        groupId: { type: string }
        type: { type: string }
        status: { type: string }
        createdTime: { type: integer, format: int64 }
        updatedTime: { type: integer, format: int64 }
        expirationTime: { type: integer, format: int64 }
        frequency: { type: integer }
        recurringIndicator: { type: boolean }
        dataAccessValidityDuration: { type: integer, format: int64 }
        attributes:
          type: object
          additionalProperties: { type: string }
        authorizations:
          type: array
          items: { $ref: '#/components/schemas/ConsentAuthorization' }
        purposes:
          type: array
          items: { $ref: '#/components/schemas/ConsentPurpose' }
        statusHistory:
          type: array
          items: { $ref: '#/components/schemas/ConsentStatusAuditItem' }
    ConsentStatusAuditItem:
      type: object
      required: [statusAuditId, currentStatus, actionTime]
      properties:
        statusAuditId: { type: string }
        previousStatus: { type: string }
        currentStatus: { type: string }
        actionTime: { type: integer, format: int64 }
        actionBy: { type: string, nullable: true }
        reason: { type: string, nullable: true }
    ConsentPurpose:
      type: object
      required: [purposeId, name, version, elements]
      properties:
        purposeId: { type: string }
        name: { type: string }
        version: { type: string }
        displayName: { type: string }
        description: { type: string }
        elements:
          type: array
          items: { $ref: '#/components/schemas/ConsentElement' }
    ConsentElement:
      type: object
      required: [elementId, name, namespace, version, approved, mandatory]
      properties:
        elementId: { type: string }
        name: { type: string }
        namespace: { type: string }
        version: { type: string }
        displayName: { type: string }
        approved: { type: boolean }
        mandatory: { type: boolean }
        description: { type: string }
        value: {}
    ConsentApprovalSelection:
      type: object
      required: [purposeId, purposeVersion, elementId, elementVersion]
      properties:
        purposeId: { type: string }
        purposeVersion: { type: string }
        elementId: { type: string }
        elementVersion: { type: string }
    ConsentAuthorization:
      type: object
      required: [id, type, status, updatedTime]
      properties:
        id: { type: string }
        userId: { type: string }
        type: { type: string }
        status: { type: string }
        updatedTime: { type: integer, format: int64 }
        resources: {}
    ProxyError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: UPSTREAM_UNAVAILABLE }
        message: { type: string, example: upstream unavailable }
    ActingSession:
      type: object
      description: >-
        What the caller may do for this owner. The delegated token itself is
        never returned; it is held in an HttpOnly cookie.
      required: [ownerId, nomineeId, scopes]
      properties:
        ownerId: { type: string, format: uuid }
        nomineeId:
          type: string
          format: uuid
          description: >-
            The real person acting, recorded so the portal can always name them
            rather than presenting the session as the owner's own.
        scopes:
          type: array
          uniqueItems: true
          items: { type: string }
          description: >-
            Narrowed at mint time to what the owner granted, forming a ceiling
            that no later request can raise.
        expiresAt: { type: string, format: date-time }
    UserSummary:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
  responses:
    AuthError:
      description: Authentication request rejected.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProxyError' }
    ProxyError:
      description: BFF or upstream proxy error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProxyError' }
    ActingForbidden:
      description: >-
        Refused by one of the two independent checks. `INSUFFICIENT_SCOPE` means
        the delegated token never carried the scope, which was fixed when the
        token was minted. `NOT_ACTIVE_NOMINEE` and `PERMISSION_DENIED` come from
        the live nomination gate, read fresh on every request, which is what makes
        withdrawal take effect at once rather than at token expiry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProxyError' }
          examples:
            insufficientScope:
              value:
                code: INSUFFICIENT_SCOPE
                message: delegated token does not carry portal:consents:write:self
            notActiveNominee:
              value:
                code: NOT_ACTIVE_NOMINEE
                message: no active nomination for this owner
            permissionDenied:
              value:
                code: PERMISSION_DENIED
                message: owner did not grant CONSENT_APPROVE to this nominee
    ActingOwnerMismatch:
      description: >-
        The caller named an owner that is not this session's, because another tab
        has since started acting for somebody else.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProxyError' }
          example:
            code: ACTING_OWNER_MISMATCH
            message: this acting session is for a different owner
    GateUnavailable:
      description: >-
        The nomination gate could not be reached, so the request is refused. A
        delegation system that allows access when its authority check is
        unavailable is worse than one with no check, because it appears to have
        one.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProxyError' }
